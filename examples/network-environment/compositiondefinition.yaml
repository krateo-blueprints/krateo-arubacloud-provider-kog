# Krateo CompositionDefinition — registers the aruba-network-environment chart
# as a Composition. Applying a Composition CR (an instance of the CRD this
# definition generates) provisions the network environment (VPC + Subnet +
# SecurityGroup + their Configurations) from one set of inputs.
#
# Package the chart under compositions/aruba-network-environment as an OCI
# artifact and point `spec.chart.url`/`version` at it (mirrors the pattern in
# krateo-blueprints/krateo-oasgen-provider-chart's compositiondefinition.yaml).
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: aruba-network-environment
  namespace: krateo-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/aruba-network-environment
    version: "0.1.0"
