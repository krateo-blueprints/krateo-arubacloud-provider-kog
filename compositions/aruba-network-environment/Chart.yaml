apiVersion: v2
name: aruba-network-environment
description: >-
  Krateo Composition that provisions an Aruba Cloud network environment
  (VPC + Subnet + SecurityGroup) as a single unit, on top of the proxy-free
  RestDefinitions in this repository. Every field it sends is derived from the
  vendored OAS by scripts/gen_composition.py, and CI applies the rendered chart
  against the generated CRDs so it cannot drift from them.
  CloudServer is deliberately not included: its create lives only in
  compute-provider_v1.1.json and is unreachable until oasgen#227 ships, so a
  composition could create the object but not give it a flavor or boot volume.
type: application
version: CHART_VERSION
appVersion: "1.0.0"
keywords:
  - krateo
  - arubacloud
  - composition
  - cloudserver
