apiVersion: v2
name: aruba-network-environment
description: >-
  Krateo Composition that provisions an Aruba Cloud network environment
  (VPC + Subnet + SecurityGroup) as a single unit, on top of the proxy-free
  RestDefinitions in this repository. Every field it sends is derived from the
  vendored OAS by scripts/gen_composition.py, and CI applies the rendered chart
  against the generated CRDs so it cannot drift from them.
  CloudServer is deliberately not included, and the original reason no longer
  applies: oasgen#227 shipped in 0.34.0 and its create is proven live. It stays
  out because its update and delete are delegated to Snowplow RESTActions, which
  need four prerequisites the oasgen-provider chart does not provide, and because
  create is refused on a trial account with no way to check eligibility first.
  See scripts/gen_composition.py's KINDS comment for the full reasoning.
type: application
version: CHART_VERSION
appVersion: "1.0.0"
# An absolute https icon is required by the krateo-blueprints publishing standard and
# the Marketplace shows it. Krateo's own brand asset rather than Aruba's: hotlinking a
# vendor's logo is not ours to decide. Verified to serve image/svg+xml, and note the
# HYPHENATED org -- krateoplatformops/.github 404s, the same install-source confusion
# scripts/validate.py already screens for in the install docs.
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  # The Marketplace renders these as tags, so they must describe what the chart
  # PROVISIONS. `cloudserver` was here and is removed: the description above spends a
  # paragraph explaining CloudServer is deliberately excluded, so the tag advertised a
  # resource this chart does not create.
  - krateo
  - arubacloud
  - composition
  - vpc
  - subnet
  - securitygroup
