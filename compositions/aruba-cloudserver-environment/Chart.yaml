apiVersion: v2
name: aruba-cloudserver-environment
description: >-
  Krateo Composition that provisions a complete Aruba Cloud environment
  (VPC + Subnet + SecurityGroup + CloudServer) as a single unit, on top of the
  proxy-free RestDefinitions in this repository. This is the "composition
  concept" answer to lifecycle-beyond-CRUD: instead of one controller doing
  many things, many single-purpose CRs are orchestrated together by a Krateo
  Composition, and the CloudServer's own multi-call lifecycle is handled by its
  RestDefinition's *ApiRef delegation (see restactions/compute/).
type: application
version: CHART_VERSION
appVersion: "1.0.0"
keywords:
  - krateo
  - arubacloud
  - composition
  - cloudserver
