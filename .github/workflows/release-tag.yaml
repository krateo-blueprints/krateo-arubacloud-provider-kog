# Packages every chart in this repo and publishes each to the GitHub Container Registry as an OCI
# Helm artifact on every semver tag. Shape-agnostic: it discovers charts by locating each Chart.yaml
# (skipping vendored subcharts under charts/), so it works regardless of the repo's directory layout.
#
# Charts opt into versioning with the CHART_VERSION placeholder in Chart.yaml, which the git tag
# replaces at publish time. Pushing tag "0.1.0" publishes each chart <name> as:
#   oci://ghcr.io/<owner>/charts/<name>:0.1.0
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  # contents: write — the stamped CompositionDefinition is attached to the release.
  # It is applied by hand and is not inside the packaged chart, so it must ship as a
  # release asset, not just live in the runner.
  contents: write
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - name: Stamp the CompositionDefinition
        run: |
          set -euo pipefail
          # The CD pins the version of the chart it installs but is not a Chart.yaml, so the
          # per-chart stamp in the packaging step never touches it. Left by hand it drifts: the
          # chart advances with the tag while the CD keeps naming an older, eventually
          # unpublished, version. This workflow publishes every chart on every tag, so stamping
          # the CD to the same tag is always valid. examples/ CDs are left as pinned fixtures.
            #
            # It also RECORDS the set it stamps, because this is the last moment the tree is
            # pristine. The packaging step copies each CD into its chart directory so the
            # archive is self-describing, and a later `find` then sees the original AND that
            # copy. That is how 0.3.0 attached two byte-identical assets --
            # compositiondefinition-compositions.yaml and
            # compositiondefinition-aruba-network-environment.yaml -- for one object.
            echo "CD_MANIFEST=${RUNNER_TEMP}/cd-manifest" >> "$GITHUB_ENV"
            export CD_MANIFEST="${RUNNER_TEMP}/cd-manifest"
            : > "${CD_MANIFEST}"
          find . -type f -name compositiondefinition.yaml \
                 -not -path '*/charts/*' -not -path '*/examples/*' -not -path '*/samples/*' -print0 \
            | while IFS= read -r -d '' cd; do
                sed -i "s/CHART_VERSION/${VERSION}/g" "$cd"; echo "stamped $cd -> ${VERSION}"
                  printf '%s\0' "$cd" >> "${CD_MANIFEST}"
              done

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: The Marketplace index token must be present
        env:
          CHARTS_PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # Checked BEFORE anything is pushed. Without it the GHCR push would succeed and
          # the index publish would not, which is the state the publishing standard exists
          # to prevent: a chart in GHCR and absent from the index is not published, because
          # the Marketplace installs from the index and never re-resolves against GHCR.
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::secret CHARTS_PUBLISH_TOKEN is not set, so this release cannot reach"
            echo "::error::the helm index and the Marketplace would never list it. Failing now,"
            echo "::error::before the GHCR push, rather than publishing half of a release."
            exit 1
          fi
          # PRESENT AND AUTHENTICATING IS NOT ENOUGH. publish-chart.yaml 1.0.0 interpolates
          # this token into a git clone URL, so a value carrying whitespace -- a trailing
          # newline from a paste is the usual way -- produces
          #
          #   fatal: ... URL rejected: Malformed input to a URL function
          #
          # at the publisher's "Clone gh-pages" step. Measured, not hypothesised:
          # github-provider-kog 0.7.6 (run 42411357647) failed exactly there on
          # 2026-11-07 and was left half-published, because its caller had already pushed
          # to GHCR.
          #
          # An API check cannot see this. The token AUTHENTICATES fine -- `gh api` strips
          # nothing and needs nothing stripped, because the value never reaches a URL. The
          # defect is in how the publisher USES it, and it is invisible to every check that
          # only asks whether the credential works. So this gate asserts the SHAPE of the
          # value as well as its power, which is the only check that runs before the push.
          #
          # A GitHub token contains no whitespace anywhere, so stripping all of it and
          # comparing is exact: it catches leading, trailing and embedded alike. The value
          # is never echoed; only the comparison's outcome is.
          if [ "${CHARTS_PUBLISH_TOKEN}" != "$(printf '%s' "${CHARTS_PUBLISH_TOKEN}" | tr -d '[:space:]')" ]; then
            echo "::error::CHARTS_PUBLISH_TOKEN contains whitespace. No GitHub token does, so the"
            echo "::error::secret was almost certainly stored with a trailing newline. The publisher"
            echo "::error::puts this value in a git URL and fails with 'Malformed input to a URL"
            echo "::error::function' AFTER the GHCR push, leaving the release half-published."
            echo "::error::Re-create the secret with no trailing newline: printf '%s' \"\$TOKEN\" | gh secret set ..."
            echo "::error::Failing now, before anything is pushed."
            exit 1
          fi

      - name: Every chart here must qualify for the `blueprints` channel
        run: |
          set -euo pipefail
          # The standard says the channel follows from the CONTENT, not from preference:
          # `blueprints` for a chart with values.schema.json AND a CompositionDefinition,
          # `pages` for one annotated `krateo.io/kind: page-set`, and `operators` for
          # everything else. The publisher refuses a mismatch -- but it refuses AFTER the
          # caller has already pushed to GHCR, which is the half-published state rule 1
          # exists to prevent, so the caller checks first.
          #
          # This repo passes a single `channel: blueprints` to the reusable workflow, which
          # is correct only while every chart here is a blueprint. Asserted rather than
          # assumed, so adding an operator or CRD chart later fails the release with the
          # reason instead of silently filing it in the wrong channel.
          bad=0
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            [ -f "$dir/values.schema.json" ] || { echo "::error::${name}: no values.schema.json"; bad=1; }
            if [ ! -f "$dir/compositiondefinition.yaml" ] && [ ! -f "$(dirname "$dir")/compositiondefinition.yaml" ]; then
              echo "::error::${name}: no CompositionDefinition in the chart dir or its parent"; bad=1
            fi
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -print0)
          # A page-set is a different channel, not a defective blueprint, so say so.
          while IFS= read -r -d '' cf; do
            grep -q "krateo.io/kind:[[:space:]]*page-set" "$cf" && {
              echo "::error::$(dirname "$cf") is annotated page-set, which belongs in the"
              echo "::error::\`pages\` channel, not \`blueprints\`."; bad=1; }
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -print0)
          [ "$bad" = "0" ] || {
            echo "::error::Not every chart here belongs in \`blueprints\`. This caller passes"
            echo "::error::ONE channel for all its charts, so split the release by channel"
            echo "::error::first. Failing before the GHCR push, not at the publisher."
            exit 1; }
          echo "every chart qualifies for the blueprints channel"

      - name: Package and push every chart
        run: |
          set -euo pipefail
          mkdir -p charts-dist
          find . -type f -name Chart.yaml -not -path '*/charts/*' -print0 | while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            name=$(awk '/^name:/{print $2; exit}' "$cf")
            echo "::group::${name} (${dir})"
            # Stamp the CHART_VERSION placeholder, and pin the package version to the tag either way.
            sed -i "s/CHART_VERSION/${VERSION}/g" "$cf"

            # A blueprint archive must be SELF-DESCRIBING: the publishing standard requires
            # values.schema.json and compositiondefinition.yaml at the archive root, because
            # the Marketplace reads the archive and nothing else. Ours lives one directory
            # above the chart, so copy the already-stamped file in.
            src=""
            [ -f "$dir/compositiondefinition.yaml" ] && src="$dir/compositiondefinition.yaml"
            [ -z "$src" ] && [ -f "$(dirname "$dir")/compositiondefinition.yaml" ] \
              && src="$(dirname "$dir")/compositiondefinition.yaml"
            if [ -n "$src" ] && [ "$src" != "$dir/compositiondefinition.yaml" ]; then
              cp "$src" "$dir/compositiondefinition.yaml"
              echo "copied $src into the chart directory"
            fi

            helm dependency update "$dir" 2>/dev/null || true
            helm package "$dir" --version "${VERSION}" --destination charts-dist

            # CHECK THE ARCHIVE, not the directory. `helm package` succeeds whether the file
            # is there or not, which is exactly how two org charts shipped a
            # CompositionDefinition pinned to someone else's version.
            tgz="charts-dist/${name}-${VERSION}.tgz"
            for want in "${name}/values.schema.json" "${name}/compositiondefinition.yaml"; do
              tar -tzf "$tgz" | grep -qx "$want" || {
                echo "::error::${tgz} does not contain ${want}"; exit 1; }
            done
            # And the CD inside the archive must name THIS version, not a literal left behind.
            cdver=$(tar -xzOf "$tgz" "${name}/compositiondefinition.yaml" \
                    | awk '/version:/{print $2; exit}')
            [ "$cdver" = "${VERSION}" ] || {
              echo "::error::${tgz}: CompositionDefinition says version ${cdver}, tag is ${VERSION}"
              exit 1; }
            echo "archive verified: schema + CompositionDefinition present, CD version ${cdver}"

            helm push "$tgz" "${OCI_REPO}"
            echo "Published ${OCI_REPO}/${name}:${VERSION}"
            echo "::endgroup::"
          done

      - name: Hand the chart tarballs to the index job
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist
          path: charts-dist/*.tgz
          if-no-files-found: error

      - name: Publish the stamped CompositionDefinition on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Runs after the charts are pushed: the chart is the primary artifact and an asset
          # problem must never block it. Stage into a fresh dir so a root-level CD is never
          # cp'd onto itself (an error, not a no-op — a lesson from selfservice 0.2.26).
          stage="$(mktemp -d)"; assets=()
          while IFS= read -r -d '' cd; do
            d="$(dirname "$cd")"
            if [ "$d" = "." ]; then out="compositiondefinition.yaml"; else out="compositiondefinition-$(basename "$d").yaml"; fi
            cp "$cd" "$stage/$out"; assets+=("$stage/$out")
            done < "${CD_MANIFEST}"
            # An absent manifest is NOT "nothing to publish": it means the stamp step never
            # recorded the set, and attaching no CD because a file went missing is the same
            # silent-success shape this workflow guards against elsewhere.
            [ -s "${CD_MANIFEST}" ] || {
              echo "::error::${CD_MANIFEST} is absent or empty, so the pristine"
              echo "::error::CompositionDefinition set was never recorded. Refusing to publish"
              echo "::error::assets from a re-walk of a tree the packaging step has written to."
              exit 1; }
          [ ${#assets[@]} -eq 0 ] && { echo "no CompositionDefinition to publish"; exit 0; }
          gh release view "${VERSION}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --title "${VERSION}" --notes "Apply the attached CompositionDefinition to register this version."
          gh release upload "${VERSION}" "${assets[@]}" --clobber
          echo "attached: ${assets[*]}"

  # Second half of the standard's rule 1: the same bytes also reach the helm index here,
  # because the Marketplace installs from the index and never re-resolves against GHCR.
  #
  # MUST BE PINNED BY FULL COMMIT SHA BEFORE THIS MERGES, with a `# 1.0.0` comment.
  # This workflow receives CHARTS_PUBLISH_TOKEN, an org-wide write token, so a moving
  # major tag would hand that token to whatever `1` points at next.
  #
  # Pinned to the commit tag 1.0.2 points at, verified rather than taken on trust:
  #
  #   git ls-remote https://github.com/krateo-blueprints/charts 'refs/tags/1.0.2^{}'
  #   f0138e816ce827279ad087202889c009899741f7  refs/tags/1.0.2^{}
  #
  # 1.0.1 fixed the token-in-a-URL defect that half-published github-provider-kog 0.7.6,
  # and then showed a second one on the first green run. The publisher clones gh-pages,
  # merges the new chart in and pushes; two repos publishing in the same minute make the
  # second push lose a race and fail with `fetch first`. Measured, not predicted:
  # openstack-as-a-service 0.3.37 (run 42414460552) took steps 1-12 green and was refused
  # at step 13. Its re-run went green on all 16, which worked only because the cause was
  # OUTSIDE the publisher -- a re-run reuses the old pin, so it cannot recover from a
  # publisher defect. 1.0.2 re-clones and retries.
  #
  # That failure leaves the version in GHCR and absent from the index until the re-run, so
  # it is a half-published state of the kind rule 1 exists to prevent -- recoverable, but
  # only by someone who notices.
  #
  # NOT 1.0.0. That release interpolated the token into a git clone URL, so a value
  # carrying whitespace failed at its "Clone gh-pages" step AFTER the caller's GHCR push.
  # github-provider-kog 0.7.6 (run 42411357647) was left half-published that way on
  # 2026-11-07. 1.0.1 keeps the token out of URLs and refuses a whitespace-bearing value
  # itself. The caller-side check above is still the only one that runs BEFORE the push.
  #
  # The `^{}` matters. 1.0.0 is an ANNOTATED tag, so `refs/tags/1.0.0` resolves to the tag
  # OBJECT (54acb674...), not to a commit, and Actions will not run a workflow pinned to
  # one. The dereferenced commit is the only correct value here.
  #
  # Tag `1` still does not exist, so the `@1` this replaces was never resolvable at all.
  # .github/dependabot.yml is already in place to bump the pin, which is the other half of
  # the trade -- a SHA pin with nothing to update it is permanently stale.
  publish-to-index:
    needs: package-and-push
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@f0138e816ce827279ad087202889c009899741f7 # 1.0.2
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
    secrets:
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
