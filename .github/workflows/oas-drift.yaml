name: oas-drift

# Aruba's specifications will change. openapi/CHECKSUMS.txt pins what we vendored,
# which is exactly the wrong direction to detect that: it proves our copy is intact
# while saying nothing about upstream having moved. This job closes that loop so a
# spec change is something we find, not something a user reports.
#
# It never edits openapi/. Adopting a change is deliberate: re-vendor, regenerate,
# re-validate, review. In particular an info.version bump renames the generated CRD
# version (1.0.0 -> v1-0-0), which breaks existing CRs and must never happen silently.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, early
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare vendored specs against what Aruba publishes today
        id: check
        run: |
          set +e
          python3 scripts/check_oas_drift.py | tee /tmp/drift.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.check.outputs.code == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = [
              'Upstream OpenAPI documents no longer match what this repository vendored.',
              '',
              '```',
              fs.readFileSync('/tmp/drift.txt', 'utf8').trim(),
              '```',
              '',
              '### Why this matters',
              '',
              'The repository consumes Aruba\'s specs byte-for-byte and derives everything from them:',
              'the generated CRDs, their versions, the sample manifests, and the RestDefinition verb',
              'paths. A change upstream can therefore be anything from cosmetic to breaking.',
              '',
              'The one to look at first is `info.version`: the CRD version is derived from it',
              '(`1.0.0` -> `v1-0-0`), so a bump renames the served version and orphans existing CRs.',
              '',
              '### To resolve',
              '',
              '1. Re-download the affected documents into `openapi/`.',
              '2. `(cd openapi && shasum -a 256 *.json | sort -k2 > CHECKSUMS.txt)`',
              '3. Re-run the generators in `scripts/`, then `python3 scripts/validate.py`.',
              '4. Review the generated diff before merging, especially any CRD version change.',
              '',
              `_Detected by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');

            const title = 'Upstream OpenAPI drift detected';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'oas-drift',
            });

            // Update in place rather than filing a fresh issue each Monday -- a weekly
            // pile of near-identical issues is how a real signal gets tuned out.
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
              core.notice(`Updated existing drift issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['oas-drift'],
              });
              core.notice(`Opened drift issue #${created.number}`);
            }

      # A GREEN RUN HERE MUST MEAN "the check looked and found nothing".
      #
      # It used to mean less than that. Both this step and the issue-filing step above were
      # gated on `code == '1'`, so the script's exit 2 -- returned deliberately when EVERY
      # document is unreachable, so that a flaky network does not cry wolf -- produced a
      # green scheduled run, no issue, and nothing anywhere saying the check had not run.
      # "I could not reach upstream" was indistinguishable from "nothing drifted", on a
      # weekly job nobody watches when it passes.
      #
      # Any code that is not 0 now fails. An unexpected code fails too: that was the same
      # hole, since only 1 was ever handled.
      - name: Fail the run unless the check looked and found nothing
        if: steps.check.outputs.code != '0'
        run: |
          code='${{ steps.check.outputs.code }}'
          case "$code" in
            1)
              echo "::error title=Upstream OpenAPI drift::Vendored documents differ from what Aruba publishes. The drift issue has the per-document detail." ;;
            2)
              echo "::error title=Drift check could not look::EVERY document was unreachable, so this run measured nothing about drift. No issue was filed because no drift was observed -- and none could have been. Re-run once upstream is reachable; do not read this as a clean result." ;;
            *)
              echo "::error title=Drift check exited unexpectedly::Exit code '$code' is not one this workflow knows how to interpret, so it is treated as 'did not look' rather than as success." ;;
          esac
          exit 1
