name: validate

# The gate this repository was missing. Every serious defect found so far -- the
# oasPath regex, the CRD version derivation, the RBAC watch verb, the Configuration
# query fields, the separate CRD chart -- was invisible to review and surfaced only
# on a real cluster. So the smoke job is not optional garnish: it is the job that
# would have caught five of the seven.
#
# No Aruba credentials are involved. A RestDefinition reaching Ready is oasgen-provider
# generating a CRD and starting a controller; it never calls the Aruba API. That is
# precisely what makes this runnable on every PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the provider the RestDefinitions are validated against. Bumping this is a
  # deliberate act with a visible diff, not something that drifts under us on a
  # Tuesday -- and the smoke job re-proves the 34 against the new version.
  #
  # 0.27.1 is the top of the range that still installs on the node image below.
  # What it buys over 0.22.2:
  #   0.23.0  #109  dotted selectors emitted nested, so LoadBalancer/CloudServer
  #                 findby can match at all (the samples flip in this same commit)
  #   0.25.0  #146  response envelope unwrapped
  #   0.26.0  #148  jq-shaped request bodies
  #   0.26.1  #166  credential headers redacted in logs -- the reason this is not
  #                 pinned at 0.25.1
  # 0.28.0 was deliberately not taken for a while: #178 raises the chart floor to
  # Kubernetes 1.36, which forces the node image up in the same breath. That floor
  # has since been taken on purpose -- see node_image below.
  #   0.35.0  libopenapi v0.21.9, so profile.json can be PARSED at all (a `+` in a
  #           schema name made it unparseable); without it AiKey does not merely
  #           fail, it never appears, and nothing reports why
  #   0.36.0  #236  an update verb on a resource with a PUT and no POST now derives
  #           its spec from the update body. AiKey is the only such resource here,
  #           and below this its PUT would silently drop `location` and `tags`
  # Both are REQUIREMENTS, not preferences: `profile` is in the provider list, so a
  # pin below 0.36.0 ships an AiKey that is wrong or absent. See scripts/providers.py.
  OASGEN_VERSION: "0.41.0"

jobs:
  validate:
    name: static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # The generators and validator parse and emit YAML; PyYAML is the only
        # third-party dependency any of them has.
        run: pip install --quiet pyyaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: scripts/validate.py
        # Enforces: the vendored OAS is byte-for-byte unmodified (sha256 vs
        # CHECKSUMS.txt), every verb path+method exists in its document, every
        # requestFieldMapping.inPath is a real path parameter, async poll paths
        # match verbatim and carry their {handleParam}, oasPath satisfies the CRD
        # regex, sample apiVersions match the derived CRD versions, and every chart
        # lints and renders.
        run: python3 scripts/validate.py

      - name: Generators are deterministic
        # The committed artefacts must be exactly what the generators produce. If
        # someone hand-edits a generated RestDefinition, the next regeneration
        # silently reverts it -- better to fail here than to lose the change later.
        run: |
          python3 scripts/generate_restdefinitions.py
          python3 scripts/gen_configmaps.py
          python3 scripts/gen_samples_and_coverage.py
          python3 scripts/gen_provider_docs.py
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the committed ones. Re-run the scripts in scripts/ and commit the result."
            git diff --stat
            git diff
            exit 1
          fi

  smoke:
    name: kind smoke test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: aruba-ci
          # Pinned, for the same reason OASGEN_VERSION is: an unpinned node image
          # means the Kubernetes version this smoke actually proves drifts with
          # whatever helm/kind-action defaults to that week.
          #
          # RAISED TO 1.36 WITH THE 0.34.0 PIN, in the same commit, because the two
          # cannot move independently. Measured from the published charts rather than
          # inferred:
          #     oasgen-provider 0.27.1  kubeVersion: '>=1.33.0-0'
          #     oasgen-provider 0.34.0  kubeVersion: '>=1.36.0-0'
          # The floor rose in chart 0.28.0 (oasgen#178): version-scoped watching needs
          # a MutatingAdmissionPolicy that 1.33-1.35 do not serve. On a 1.33 node Helm
          # refuses the chart outright, and the job would fail for a reason that has
          # nothing to do with the RestDefinitions it exists to test.
          #
          # This is a real cost passed to users, not just to CI: installing this
          # blueprint now requires Kubernetes >= 1.36. It was taken deliberately, to
          # get oasgen#227 (per-verb oasPath reaching the controller, which is what
          # makes CloudServer's create reachable at all) and #225 (an appended
          # additionalStatusFields entry actually regenerating an existing CRD, which
          # is what makes our status.error append take effect).
          node_image: kindest/node:v1.36.4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install oasgen-provider
        run: |
          helm install oasgen-provider-crds \
            oci://ghcr.io/krateo-platformops/charts/oasgen-provider-crds \
            --version "${OASGEN_VERSION}" --namespace krateo-system --create-namespace --wait
          helm install oasgen-provider \
            oci://ghcr.io/krateo-platformops/charts/oasgen-provider \
            --version "${OASGEN_VERSION}" --namespace krateo-system --wait --timeout 5m

      - name: Apply OAS ConfigMaps and RestDefinitions
        run: |
          kubectl apply -n krateo-system -f configmaps/
          # -n krateo-system is NOT decoration. The manifests declare no namespace, so
          # without it they land in `default` -- and oasgen deploys each generated
          # controller into its RestDefinition's own namespace, so all 34 controllers
          # follow them there. The readiness check below counts with -A, so this job
          # stayed green for the whole life of the repo while proving a layout nobody
          # installs: docs/usage.md, the Helm chart and the live clusters all put these
          # in krateo-system. Caught 2026-10-20 by mirroring this job locally and
          # counting in krateo-system, where the answer was 0/34.
          kubectl apply -n krateo-system -R -f restdefinitions/

      - name: Every RestDefinition reaches Ready
        run: |
          set -uo pipefail
          expected=$(find restdefinitions -name '*.yaml' | wc -l | tr -d ' ')
          echo "expecting ${expected} RestDefinitions to become Ready"

          # Poll rather than `kubectl wait`: each RestDefinition generates a CRD and
          # rolls out a controller Deployment, so the set becomes Ready gradually and
          # a per-object wait would serialise what is actually happening in parallel.
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            ready=$(kubectl get restdefinitions.ogen.krateo.io -A \
              -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              2>/dev/null | grep -c '^True$' || true)
            echo "  ready ${ready}/${expected}"
            [ "${ready}" = "${expected}" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::only ${ready}/${expected} RestDefinitions became Ready within 10m"
              kubectl get restdefinitions.ogen.krateo.io -A
              # Select the FAILURES, do not head-truncate everything. The previous
              # form was `-o yaml | grep -A10 'conditions:' | head -100`, which dumps
              # every definition in cluster order and cuts off long before the
              # interesting one -- on the run that caught arubacloud-profile-aikey it
              # printed 100 lines of healthy Ready=True blocks and not one word of the
              # single resource that failed, so the error had to be guessed at.
              echo "--- definitions that are not Ready ---"
              kubectl get restdefinitions.ogen.krateo.io -A -o json | jq -r '
                .items[]
                | select((.status.conditions // []) | any(.type=="Ready" and .status!="True"))
                | "=== \(.metadata.namespace)/\(.metadata.name)\n\(.status.conditions)"'
              # Generation emits warnings as EVENTS (BuiltInNameCollision,
              # ApiRefWithoutSnowplow, schema mismatches). A reason the condition does
              # not carry is often sitting here instead.
              echo "--- warning events in krateo-system ---"
              kubectl -n krateo-system get events --field-selector type=Warning \
                --sort-by=.lastTimestamp | tail -40 || true
              kubectl -n krateo-system logs deploy/oasgen-provider --tail=200 || true
              exit 1
            fi
            sleep 15
          done

      - name: Each Configuration CRD exposes EXACTLY its document's auth method
        # From the openstack-nova-operator-kog session. The load-bearing idea is
        # theirs: the comparison is EQUALITY, not membership.
        #
        #     got == ["apiKey"]      a completeness assertion
        #     "apiKey" in got        passes on a CRD that ALSO carries bearer
        #
        # Membership cannot see the interesting failure -- a document generating BOTH
        # methods -- and nor can the rejection evidence this repo already has. A
        # published 0.2.0 chart sent authentication.bearer to three resources whose
        # document declares apiKey and the API server refused it; that proves the
        # wrong thing is REFUSED, while this proves there is nothing wrong to reach
        # for. Complementary, and neither subsumes the other.
        #
        # The expectation is derived from the same OAS the generator reads, so it
        # cannot drift from the documents: 7 of the 12 provider documents declare
        # apiKey in:header, 5 declare http/bearer. Reads only; no vendor API.
        #
        # Gates on each CRD's Established condition rather than the RestDefinition's
        # Ready -- nova measured Ready going true BEFORE the CRDs exist, twice
        # (oasgen-provider#314), so reading off Ready is a race that fails as absent.
        # No KUBE_CONTEXT: every other step in this job uses the ambient context
        # that kind-action sets, and hardcoding `kind-aruba-ci` here would be a
        # second place for the cluster_name to drift out of step with.
        run: python3 scripts/assert_auth_crds.py

      - name: Samples are accepted by the generated CRDs
        # The generated CRDs use strict decoding, so this catches a sample whose
        # apiVersion or field set no longer matches what oasgen generated -- the
        # exact class of break that hit all 34 samples once already. Server-side
        # dry-run validates against the live schema without creating anything, in
        # Kubernetes or at Aruba.
        run: |
          set -uo pipefail
          fail=0
          for f in $(find samples -name '*.yaml'); do
            if ! out=$(kubectl apply --dry-run=server -f "$f" 2>&1); then
              echo "::error file=${f}::${out}"
              fail=1
            fi
          done
          exit $fail

      - name: Composition charts render against the generated CRDs
        # The gap that let a broken chart ship twice. `helm lint` and `helm template`
        # both pass on a chart that no cluster will accept -- neither knows what a CRD
        # contains. The published 0.2.0 chart sent apiVersion v1alpha1 where the CRDs
        # serve v1-0-0, authentication.bearer to three resources whose document
        # declares apiKey, query verbs to a Configuration that has none, and
        # properties.network to a Vpc whose create body is {default, preset}. Every
        # one of those renders cleanly and every one is rejected by the API server.
        #
        # So the chart is now applied, server-side dry run, against the CRDs this very
        # job generated. Nothing is created, in Kubernetes or at Aruba.
        run: |
          set -uo pipefail
          fail=0
          for chart in compositions/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            work=$(mktemp -d)
            cp -r "$chart" "$work/c"
            # Same placeholder substitution validate.py does: the tree never holds a
            # version, so an unstamped chart cannot be rendered as-is.
            sed -i "s/^version: CHART_VERSION$/version: 0.0.0/" "$work/c/Chart.yaml"
            if ! rendered=$(helm template ci "$work/c" 2>&1); then
              echo "::error file=${chart}Chart.yaml::render failed: ${rendered}"
              fail=1; continue
            fi
            if ! out=$(printf '%s' "$rendered" | kubectl apply --dry-run=server -f - 2>&1); then
              echo "::error file=${chart}Chart.yaml::rejected by the generated CRDs: ${out}"
              fail=1
            else
              echo "  ${chart} accepted by the generated CRDs"
            fi
          done
          exit $fail

      - name: Provider logged no errors
        # A controller that starts, serves, and logs errors on every reconcile still
        # reports Ready. The RBAC watch defect looked exactly like this.
        run: |
          if kubectl -n krateo-system logs deploy/oasgen-provider --tail=-1 \
               | grep -iE '"level":"(error|fatal)"' | head -20 | grep .; then
            echo "::error::oasgen-provider logged errors"
            exit 1
          fi
          echo "clean"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n krateo-system logs deploy/oasgen-provider --tail=300 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
