# Mints Aruba access tokens from a stored client credential, so nothing has to be
# refreshed by hand. The tokens last ~1 hour; this is what makes an unattended
# install survive past that.
#
# Only the CLIENT CREDENTIAL is stored (bootstrap once with scripts/eso-bootstrap.sh).
# The access token itself is never written to disk or to git -- ESO fetches it and
# writes it straight into the target Secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aruba-oauth
spec:
  provider:
    webhook:
      url: https://mylogin.aruba.it/auth/realms/cmp-new-apikey/protocol/openid-connect/token
      method: POST
      headers:
        Content-Type: application/x-www-form-urlencoded
      # `urlquery` is not optional here. This body is form-urlencoded, where a literal
      # `+` decodes to a SPACE -- and Aruba client secrets routinely contain `+`, `/`
      # and `=`. Interpolating them raw yields a corrupted secret and an
      # `invalid_client` error that looks exactly like a wrong password. The same trap
      # is why scripts/get-aruba-token.sh uses curl --data-urlencode rather than -d.
      body: >-
        grant_type=client_credentials&client_id={{ .clientId | urlquery }}&client_secret={{ .clientSecret | urlquery }}
      result:
        # The raw JSON field, so no trailing newline can reach the Authorization
        # header. A newline there produces Go's opaque
        # `net/http: invalid header field value for "Authorization"`.
        jsonPath: $.access_token
      secrets:
        - name: clientId
          secretRef:
            name: aruba-client-credentials
            namespace: krateo-system
            key: client_id
        - name: clientSecret
          secretRef:
            name: aruba-client-credentials
            namespace: krateo-system
            key: client_secret
