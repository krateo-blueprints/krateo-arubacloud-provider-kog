# Produces the `arubacloud-token` Secret the generated <Kind>Configurations read.
#
# refreshInterval is deliberately well inside the token's ~1h lifetime: ESO replaces
# the value roughly twice per token generation, so an expiry is never reached. The
# controllers pick the new value up WITHOUT restarting -- verified three times on a
# live cluster (docs/live-cluster-test.md), which is the premise this whole approach
# rests on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arubacloud-token
  namespace: default
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: aruba-oauth
    kind: ClusterSecretStore
  target:
    name: arubacloud-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        # The webhook provider has no real key-value space to address; the request is
        # fully described by the store. This is required by the schema and otherwise
        # unused.
        key: access_token
