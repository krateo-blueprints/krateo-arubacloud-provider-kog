apiVersion: arubacloud.ogen.krateo.io/v1-0-0
kind: Kaas
metadata:
  name: example-kaas
  namespace: default
  annotations:
    krateo.io/connector-verbose: 'true'
spec:
  configurationRef:
    name: kaas-config
    namespace: default
  projectId: REPLACE
  metadata:
    name: example-kaas
    location: {}
    tags: []
  properties:
    preset: false
    vpc:
      uri: REPLACE
    subnet:
      uri: REPLACE
    nodeCidr:
      address: REPLACE
      name: REPLACE
    podCidr: REPLACE
    securityGroup:
      name: REPLACE
    kubernetesVersion:
      value: REPLACE
    nodePools: []
    ha: false
    storage:
      maxCumulativeVolumeSize: 0
    billingPlan:
      billingPeriod: REPLACE
    # clientSecret is NOT settable here: it is excluded from the spec and sourced from a
    # Secret in the CR's own namespace, named after the CR and keyed by this clientId:
    #
    #   kubectl create secret generic example-kaas \
    #     --from-literal="<clientId>=<the client secret>"
    #
    # Omit the whole `identity` block if this cluster has no identity provider -- the
    # resolver is guarded on clientId, so no Secret is read and nothing is sent.
    identity:
      clientId: REPLACE
    autoscalerProfile: {}
    apiServerAccessProfile:
      authorizedIpRanges: []
      enablePrivateCluster: false
