apiVersion: arubacloud.ogen.krateo.io/v1-0-0
kind: Kaas
metadata:
  name: example-kaas
  namespace: default
  annotations:
    krateo.io/connector-verbose: 'true'
spec:
  configurationRef:
    name: kaas-config
    namespace: default
  projectId: REPLACE
  metadata:
    name: example-kaas
    location: {}
    tags: []
  properties:
    preset: false
    vpc:
      uri: REPLACE
    subnet:
      uri: REPLACE
    nodeCidr:
      address: REPLACE
      name: REPLACE
    podCidr: REPLACE
    securityGroup:
      name: REPLACE
    kubernetesVersion:
      value: REPLACE
    nodePools: []
    ha: false
    storage:
      maxCumulativeVolumeSize: 0
    billingPlan:
      billingPeriod: REPLACE
    identity:
      clientId: REPLACE
    autoscalerProfile: {}
    apiServerAccessProfile:
      authorizedIpRanges: []
      enablePrivateCluster: false
---
# Supplies spec-absent field `properties.identity.clientSecret` at create time. `properties.identity.clientSecret` is deliberately not a
# spec field: a credential in a CR spec is readable by anyone who can read the CR.
#
# name <- metadata.name   key <- spec.properties.identity.clientId
# Both are JSONPaths into the CR above, and the Secret is always read from the CR's own
# namespace. Change either value in the CR and the Secret must follow.
apiVersion: v1
kind: Secret
metadata:
  name: replace-matching-metadata-name
  namespace: default
type: Opaque
stringData:
  REPLACE_matching_spec_properties_identity_clientId: REPLACE_WITH_THE_VALUE
# The API may want this value in a particular encoding -- check the resource's page
# under docs/providers/ before assuming it takes the raw value.
