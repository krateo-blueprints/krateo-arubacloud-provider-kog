# schedule/Job. A step's only supported actions are poweron / poweroff via POST
# (Aruba metadata docs: "Only `poweron` and `poweroff` are currently supported",
# body must be null), so a Job REQUIRES a CloudServer to target.
#
# The server is created out of band because its POST lives in the 1.1 OAS document and a
# RestDefinition carries a single oasPath (oasgen-provider#108). Its id is passed in via
# the environment, so this fixture pins nothing:
#
#   GA_CS_ID=<cloudserver id> python3 scripts/ga_chain.py tests/ga/chains/job.yaml
#
# enabled: false — the job is never meant to fire; this proves the resource lifecycle,
# not the power operation.
name: job
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
  CS_ID: ""
residue:
  - /projects/${PROJECT}/providers/Aruba.Schedule/jobs
resources:
  - kind: ScheduledJob
    name: ga-job
    spec:
      configurationRef: {name: scheduledjob-config, namespace: default}
      projectId: "${PROJECT}"
      metadata:
        name: ga-job
        location: {value: "${LOCATION}"}
        tags: []
      properties:
        scheduleJobType: Recurring
        cron: "0 3 * * *"
        enabled: false
        executeUntil: "2027-01-01T00:00:00Z"
        steps:
          - name: ga-poweroff
            httpVerb: POST
            resourceUri: "/projects/${PROJECT}/providers/Aruba.Compute/cloudServers/${CS_ID}"
            # RELATIVE, and this is load-bearing: a full path is refused with "The
            # action /projects/.../poweroff with http verb POST is not configured for
            # this resource typology", which reads like the action is unsupported when
            # it is only spelled wrong. Proven live; see docs/live-cluster-test.md.
            # An earlier version of this fixture carried the full path, so it could
            # never have created a Job -- the same shape of defect as Registry's size.
            actionUri: "poweroff"
    drift: /projects/${PROJECT}/providers/Aruba.Schedule/jobs/${id:self}
