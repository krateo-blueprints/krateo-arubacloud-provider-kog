# SecurityGroup and SecurityRule, under the same runner as every other chain.
#
# Both were already GA on live evidence, but that evidence came from
# scripts/ga-chain-test.sh -- a second, older harness that duplicates this one's
# drift probe, residue check and teardown in bash. Two runners means a resource can
# be "covered" in a place nobody runs, which is how DatabaseBackup sat in no chain at
# all while carrying a defect that made Ready unreachable. The payloads here are the
# ones that harness used, unchanged, so this is a port and not a new claim.
#
# Free: VPCs, security groups and rules do not bill. No --with-billable needed.
name: network-security
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
residue:
- /projects/${PROJECT}/providers/Aruba.Network/vpcs
resources:
- kind: Vpc
  name: ga-ns-vpc
  spec:
    configurationRef:
      name: vpc-config
      namespace: default
    projectId: ${PROJECT}
    metadata:
      name: ga-ns-vpc
      location:
        value: ${LOCATION}
      tags: []
    properties:
      default: false
      preset: false
- kind: SecurityGroup
  name: ga-ns-sg
  spec:
    configurationRef:
      name: securitygroup-config
      namespace: default
    projectId: ${PROJECT}
    vpcId: ${id:ga-ns-vpc}
    metadata:
      name: ga-ns-sg
      location:
        value: ${LOCATION}
      tags: []
    properties:
      default: false
      preset: false
  drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-ns-vpc}/securityGroups/${id:self}
- kind: SecurityRule
  name: ga-ns-sr
  spec:
    configurationRef:
      name: securityrule-config
      namespace: default
    projectId: ${PROJECT}
    vpcId: ${id:ga-ns-vpc}
    securityGroupId: ${id:ga-ns-sg}
    metadata:
      name: ga-ns-sr
      location:
        value: ${LOCATION}
      tags: []
    properties:
      direction: Ingress
      protocol: TCP
      port: "443"
      target:
        kind: Ip
        value: 0.0.0.0/0
  drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-ns-vpc}/securityGroups/${id:ga-ns-sg}/securityRules/${id:self}
