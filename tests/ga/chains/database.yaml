name: database
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
  VPC_ID: 69a5609fa851081197caa45f
  SUBNET_ID: 69a560ce2312085699426c28
  SG_ID: 69a560ce2312085699426c2a
residue:
- /projects/${PROJECT}/providers/Aruba.Database/dbaas
- /projects/${PROJECT}/providers/Aruba.Database/backups
resources:
- kind: Dbaas
  name: ga-dbaas
  billable: true
  spec:
    configurationRef:
      name: dbaas-config
      namespace: default
    projectId: ${PROJECT}
    metadata:
      name: ga-dbaas
      location:
        value: ${LOCATION}
      tags: []
    properties:
      dataCenter: ITBG-1
      engine:
        id: mysql-8.0
      flavor:
        name: DBO1A2
      storage:
        sizeGb: 20
      billingPlan:
        billingPeriod: Hour
      networking:
        vpcUri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${VPC_ID}
        subnetUri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${VPC_ID}/subnets/${SUBNET_ID}
        securityGroupUri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${VPC_ID}/securityGroups/${SG_ID}
  drift: /projects/${PROJECT}/providers/Aruba.Database/dbaas/${id:self}
- kind: Database
  name: ga-database
  billable: true
  idPath: name
  spec:
    configurationRef:
      name: database-config
      namespace: default
    projectId: ${PROJECT}
    dbaasId: ${id:ga-dbaas}
    name: gadb
- kind: DatabaseUser
  name: ga-dbuser
  billable: true
  idPath: username
  spec:
    configurationRef:
      name: databaseuser-config
      namespace: default
    projectId: ${PROJECT}
    dbaasId: ${id:ga-dbaas}
    username: gauser
    # BASE64, and this is NOT documented anywhere in the OAS. A plaintext password is
    # rejected with "Password does not match the minimum requirements", which reads as a
    # policy failure and is not one -- every plaintext value fails, including Aruba's own
    # SDK example. Their Terraform provider encodes client-side:
    #   internal/provider/dbaasuser_resource.go:130
    #   passwordBase64 := base64.StdEncoding.EncodeToString([]byte(...))
    # Decoded value here: Prova123456789AC@
    #
    # The same error is ALSO returned while the DBaaS user API is still initialising,
    # even with a correct password -- the provider polls GET on a non-existent user until
    # it 404s to prove the API is up. Two unrelated causes, one misleading message.
    password: UHJvdmExMjM0NTY3ODlBQ0A=
- kind: Grant
  name: ga-grant
  billable: true
  idPath: user
  spec:
    configurationRef:
      name: grant-config
      namespace: default
    projectId: ${PROJECT}
    dbaasId: ${id:ga-dbaas}
    databaseName: gadb
    user:
      username: gauser
    role:
      name: ReadOnly
- kind: DatabaseBackup
  name: ga-dbbackup
  billable: true
  # Placed last so teardown (reverse order) removes the backup before the Dbaas it
  # points at. No `drift` block: the OAS gives backups no update verb, so the bar is
  # create -> observe -> delete, as for the other seven immutable resources.
  #
  # This is the one resource whose emitted status oasgen#146 changes, which is why it
  # was added to the chain -- see docs/live-cluster-test.md.
  spec:
    configurationRef:
      name: databasebackup-config
      namespace: default
    projectId: ${PROJECT}
    metadata:
      name: ga-dbbackup
      location:
        value: ${LOCATION}
      tags: []
    properties:
      dataCenter: ITBG-1
      dbaas:
        uri: /projects/${PROJECT}/providers/Aruba.Database/dbaas/${id:ga-dbaas}
      database:
        name: gadb
      billingPlan:
        billingPeriod: Hour
