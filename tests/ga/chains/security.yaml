# Wave 4 (partial) — security. Kms BILLS (`billingPeriod`), and Key and Kmip are its
# children, so the whole provider sits behind a paid parent. That correction is why
# this is not in Wave 2.
#
# Only Kms is drift-tested here, and for Key and Kmip that is the FINAL answer rather
# than a gap. Their update bodies are KeyNameDto and KmipNameDto -- `{name}` only --
# and `name` is the identifier, so there is no non-identifying field left to converge.
# driftBody/driftAssert (added for Folder, which had the same flat shape) does not
# help: the only field it could perturb here is the identifier itself, and correcting
# that is renaming, not converging. Drift is INAPPLICABLE, which is a GA bar met, not
# a GA bar skipped -- the same reasoning as Restore and KeyPair.
#
# An earlier version of this header said both could "reach beta but not GA until a
# per-resource drift field is declared". All three are GA; what unblocked Kmip was
# compareScope: updatable, not a drift field (oasgen#213).
name: security
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
residue:
  - /projects/${PROJECT}/providers/Aruba.Security/kms
resources:
  - kind: Kms
    name: ga-kms
    billable: true
    spec:
      configurationRef: {name: kms-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-kms, location: {value: "${LOCATION}"}, tags: []}
      properties:
        billingPeriod: Hour
    drift: /projects/${PROJECT}/providers/Aruba.Security/kms/${id:self}

  - kind: Key
    name: ga-key
    self: /projects/${PROJECT}/providers/Aruba.Security/kms/${id:ga-kms}/keys/ga-key
    billable: true
    spec:
      configurationRef: {name: key-config, namespace: default}
      projectId: "${PROJECT}"
      id: "${id:Kms}"
      name: ga-key
      algorithm: Aes

  - kind: Kmip
    name: ga-kmip
    self: /projects/${PROJECT}/providers/Aruba.Security/kms/${id:ga-kms}/kmip/${id:self}
    billable: true
    spec:
      configurationRef: {name: kmip-config, namespace: default}
      projectId: "${PROJECT}"
      id: "${id:Kms}"
      name: ga-kmip
