# Key carries a `self:` URL because this chain's residue list covers /kms only. A key
# that disappeared when its KMS went is indistinguishable from one the controller
# deleted, and Key is GA -- so that evidence has to be the stronger kind.
name: security-key
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
residue:
- /projects/${PROJECT}/providers/Aruba.Security/kms
resources:
- kind: Kms
  name: ga-kms
  billable: true
  spec:
    configurationRef:
      name: kms-config
      namespace: default
    projectId: ${PROJECT}
    metadata:
      name: ga-kms
      location:
        value: ${LOCATION}
      tags: []
    properties:
      billingPeriod: Hour
  drift: /projects/${PROJECT}/providers/Aruba.Security/kms/${id:self}
- kind: Key
  name: ga-key
  self: /projects/${PROJECT}/providers/Aruba.Security/kms/${id:ga-kms}/keys/ga-key
  billable: true
  spec:
    configurationRef:
      name: key-config
      namespace: default
    projectId: ${PROJECT}
    id: ${id:Kms}
    name: ga-key
    algorithm: Aes
