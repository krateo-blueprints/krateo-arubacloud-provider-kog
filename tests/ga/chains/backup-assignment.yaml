# DO NOT RUN THIS CHAIN CASUALLY. Every real run of it leaves a resource that can
# never be deleted. See "the cost of a verdict" below.
#
# Two resources here carry a `-c` suffix because the earlier names are taken, by
# corpses. `ga-bpa-policy` + `ga-bpa` have been stuck in `Deleting` since
# 2026-09-04; as of 2026-10-31 the `-b` pair is wedged identically -- `ga-bpa-b`
# created 2026-10-23, still `Deleting`, DELETE -> 400 `Invalid status`. The
# rename is therefore not cosmetic: findby matches by NAME, and reusing a wedged
# name would adopt a dying resource exactly as described next. findby matches by NAME, so the chain ADOPTED the dying resources --
# the CR reported Ready against something in `Deleting`.
#
# That was fixed in two steps, and the first was only half a fix: renaming the policy
# alone still left the assignment colliding, so the next run adopted the wedged
# ASSIGNMENT instead and failed differently -- `delete of ga-bpa did not remove the
# external resource, which is still present`, a delete failure reported while the
# resource was supposedly being created. Both names are now distinct.
#
# Worth noting as a defect in its own right: a resource in `Deleting` satisfied findby
# and was reported Ready. Observing a resource on its way out of existence as healthy
# is not a property anyone would want.
#
# THE COST OF A VERDICT. BackupPolicyAssignment sits at beta because its delete has
# never been observed to COMPLETE. It enters `Deleting`, and every further DELETE
# returns 400 `Invalid status`.
#
# An earlier version of this note called that "proven broken". It is not, and the
# overstatement is worth keeping visible. The 400s are the ordinary state refusal this
# API gives any write on a resource mid-transition -- the same shape that produced
# three wrong explanations for VpnTunnel's drift before the right one turned out to be
# "wait longer". And the one run that could have settled it was spoiled by hand: when
# teardown stalled, the referenced BlockStorage was force-deleted OUT OF DEPENDENCY
# ORDER, and an assignment cannot finish deleting once the volume it binds is gone.
# That is what made `6a9aea83` permanent -- residue of a mistake, not a demonstration
# of a defect.
#
# So the open question is narrow and answerable: does the delete complete if the
# volume stays alive and the probe waits long enough? Nothing has ever waited more
# than three minutes, because that was the harness's fixed budget. It is now
# DELETE_VERIFY_SECONDS, and this chain is the reason.
#
# Run it as:
#   TIMEOUT=3600 DELETE_VERIFY_SECONDS=2700 python3 scripts/ga_chain.py \
#       tests/ga/chains/backup-assignment.yaml --with-billable
#
# and DO NOT intervene when the teardown appears to hang -- the hang IS the
# measurement. If it still has not completed when the window closes, the verdict is
# the same as before but now actually earned, and the cost is one more wedged
# assignment. Do not force-delete the volume to hurry it along; that is precisely the
# mistake that cost the last verdict.
# schedule/BackupPolicyAssignment binds a BackupPolicy to a resource. Both parents are
# already GA-proven, so this chain is the cheapest remaining: one 20 GB volume (hourly,
# billable) plus a free policy.
#
# The policy's resourceType must be exactly "volume" (undeclared in the OAS, discovered
# by a 400), which is why the assignable resource here is a BlockStorage.
name: backup-assignment
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
residue:
  - /projects/${PROJECT}/providers/Aruba.Schedule/backupPolicies
  - /projects/${PROJECT}/providers/Aruba.Schedule/backupPolicyAssignments
  - /projects/${PROJECT}/providers/Aruba.Storage/blockStorages
resources:
  - kind: BlockStorage
    name: ga-bpa-vol
    self: /projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:self}
    billable: true
    spec:
      configurationRef: {name: blockstorage-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-bpa-vol, location: {value: "${LOCATION}"}, tags: []}
      properties:
        sizeGb: 20
        billingPeriod: Hour

  - kind: BackupPolicy
    name: ga-bpa-policy-c
    self: /projects/${PROJECT}/providers/Aruba.Schedule/backupPolicies/${id:self}
    spec:
      configurationRef: {name: backuppolicy-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-bpa-policy-c, tags: []}
      properties:
        resourceType: volume
        schedules:
          - frequency: Daily
            backupType: Full
            retentionDays: 1
            time: "02:00:00"

  - kind: BackupPolicyAssignment
    name: ga-bpa-c
    spec:
      configurationRef: {name: backuppolicyassignment-config, namespace: default}
      projectId: "${PROJECT}"
      metadata: {name: ga-bpa-c, location: {value: "${LOCATION}"}, tags: []}
      properties:
        backupPolicy:
          uri: "/projects/${PROJECT}/providers/Aruba.Schedule/backupPolicies/${id:ga-bpa-policy-c}"
        resource:
          uri: "/projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:ga-bpa-vol}"
    drift: /projects/${PROJECT}/providers/Aruba.Schedule/backupPolicyAssignments/${id:self}
