# Vpc and Subnet carry no drift block here on purpose: network-security.yaml already
# exercises their drift, and duplicating it would double the runtime of this chain for
# no new evidence. VpcPeering and VpcPeeringRoute DO carry one -- added 2026-10-22,
# because this chain had none at all, and VpcPeering's GA note had started claiming
# drift coverage "under tests/ga/chains/peering-route.yaml" that did not exist here.
# Every resource carries a `self:` URL so teardown verifies its DELETE against the API
# while its parent still exists. VpcPeering in particular was GA on weaker evidence
# than the rule now demands: this chain's residue list covers /vpcs only, so a peering
# that vanished with its VPC was indistinguishable from one the controller deleted.
name: peering-route
vars:
  PROJECT: 69a55c8d5e6f0e14f14093ff
  LOCATION: ITBG-Bergamo
  CIDR_A: 10.100.0.0/24
  CIDR_B: 10.200.0.0/24
residue:
- /projects/${PROJECT}/providers/Aruba.Network/vpcs
resources:
- kind: Vpc
  name: ga-pr-vpc-a
  self: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:self}
  spec:
    configurationRef:
      name: vpc-config
      namespace: default
    projectId: ${PROJECT}
    metadata:
      name: ga-pr-vpc-a
      location:
        value: ${LOCATION}
      tags: []
    properties:
      default: false
      preset: false
- kind: Vpc
  name: ga-pr-vpc-b
  self: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:self}
  spec:
    configurationRef:
      name: vpc-config
      namespace: default
    projectId: ${PROJECT}
    metadata:
      name: ga-pr-vpc-b
      location:
        value: ${LOCATION}
      tags: []
    properties:
      default: false
      preset: false
- kind: Subnet
  name: ga-pr-subnet-a
  self: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-a}/subnets/${id:self}
  spec:
    configurationRef:
      name: subnet-config
      namespace: default
    projectId: ${PROJECT}
    vpcId: ${id:ga-pr-vpc-a}
    metadata:
      name: ga-pr-subnet-a
      location:
        value: ${LOCATION}
      tags: []
    properties:
      type: Advanced
      default: false
      network:
        address: ${CIDR_A}
- kind: Subnet
  name: ga-pr-subnet-b
  self: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-b}/subnets/${id:self}
  spec:
    configurationRef:
      name: subnet-config
      namespace: default
    projectId: ${PROJECT}
    vpcId: ${id:ga-pr-vpc-b}
    metadata:
      name: ga-pr-subnet-b
      location:
        value: ${LOCATION}
      tags: []
    properties:
      type: Advanced
      default: false
      network:
        address: ${CIDR_B}
- kind: VpcPeering
  name: ga-pr-peering
  self: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-a}/vpcPeerings/${id:self}
  drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-a}/vpcPeerings/${id:self}
  spec:
    configurationRef:
      name: vpcpeering-config
      namespace: default
    projectId: ${PROJECT}
    vpcId: ${id:ga-pr-vpc-a}
    metadata:
      name: ga-pr-peering
      location:
        value: ${LOCATION}
      tags: []
    properties:
      remoteVpc:
        uri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-b}
- kind: VpcPeeringRoute
  name: ga-pr-route
  self: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-a}/vpcPeerings/${id:ga-pr-peering}/vpcPeeringRoutes/${id:self}
  drift: /projects/${PROJECT}/providers/Aruba.Network/vpcs/${id:ga-pr-vpc-a}/vpcPeerings/${id:ga-pr-peering}/vpcPeeringRoutes/${id:self}
  billable: true
  spec:
    configurationRef:
      name: vpcpeeringroute-config
      namespace: default
    projectId: ${PROJECT}
    vpcId: ${id:ga-pr-vpc-a}
    vpcPeeringId: ${id:ga-pr-peering}
    metadata:
      name: ga-pr-route
      location:
        value: ${LOCATION}
      tags: []
    properties:
      localNetworkAddress: ${CIDR_A}
      remoteNetworkAddress: ${CIDR_B}
      billingPlan:
        billingPeriod: Hour
