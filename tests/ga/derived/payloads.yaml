    \nConfigurationRef key-config (KeyConfiguration/key-config) exists in namespace default on kind-aruba-ga."
- provider: project
  kind: Folder
  billable: false
  dependsOn: []
  spec: 'configurationRef: {name: folder-config, namespace: default}

    name: ga-folder

    default: false'
  idField: id
  hasUpdateVerb: true
  driftUrl: ''
  driftField: ''
  confidence: high
  undeclaredConstraints:
  - 'OAS declares NO required fields on FolderDto (both `name` and `default` are `nullable: true`), but
    `name` is effectively mandatory: the RestDefinition sets `identifiers: [name]` and POST /folders returns
    204 No Content with no body, so the id can only be recovered by matching `name` in the findby list.
    A folder created without a name can never be resolved and would be orphaned.'
  - '`name` must be unique across the whole account. Because create returns 204 and the id comes from
    GET /folders matched on name, a duplicate name resolves status.id to the wrong folder and a later
    delete removes someone else''s folder. Use a run-unique name.'
  - '`default` is an account-wide singleton, not a per-object attribute: setting it true demotes whatever
    folder is currently the account default, and correcting it back to false does not restore the previous
    one. Never perturb it in a drift test.'
  - 'FolderUpdateDto has `additionalProperties: false` and accepts ONLY {name, default}. The generic drift
    injector in scripts/ga_chain.py does GET -> mutate -> PUT of the whole body; the GET returns FolderResponseDto
    with id/createdBy/projectCount/dueDate/automaticRenew/ownerId etc., which are not in the update DTO.
    A whole-body PUT is therefore not a safe drift vehicle here.'
  - "Folder is account-scoped, not project-scoped: the paths are /folders and /folders/{id} with no /projects/{p}/providers/...\
    \ prefix. ${PROJECT} and ${LOCATION} are unused, and there is no `metadata` wrapper and no `tags`\
    \ field \u2014 the spec is flat."
  - 'Status shape differs from the metadata-wrapped resources: flat `status.id`, not `status.metadata.id`
    (documented in docs/live-cluster-test.md).'
  - 'Configuration sends `api-version: ''1.0''` on every verb even though the OAS declares `default: "1"`
    (samples/project/folder-configuration.yaml).'
  notes: "CRD verified: kubectl --context kind-aruba-ga get crd folders.arubacloud.ogen.krateo.io -o json.\
    \ spec has exactly three properties \u2014 configurationRef (required), name (string), default (boolean).\
    \ Nothing else will survive strict decoding; there is no projectId, location, metadata or tags.\n\n\
    BILLABLE=false: grep for /billing[A-Za-z]*/ over the whole CRD JSON returns nothing (no billingPlan,\
    \ no billingPeriod), and a folder is an organizational container, not a provisioned resource. FolderResponseDto\
    \ does carry automaticRenew/dueDate/renewAllowed and there is a /folders/{id}/automaticrenew endpoint,\
    \ but those are renewal metadata on the container, not a charge on the folder itself; the existing\
    \ tests/ga/folder.yaml fixture is already classified free in tests/ga/README.md.\n\nID FIELD=\"id\"\
    , taken from the findby response schema as required: GET /folders -> FolderListResponseDto.values[]\
    \ -> FolderListItemResponseDto, whose first property is `id`. (Cross-checked against docs/live-cluster-test.md,\
    \ which records project/Folder as path param {id} / findby field `id` \u2014 the one case where the\
    \ old always-`id` heuristic happened to be right.)\n\nDRIFT: intentionally empty, and this is not\
    \ a gap in my analysis \u2014 the repo already reached the same conclusion and it is encoded in scripts/gen_samples_and_coverage.py\
    \ TIERS and docs/coverage.md line 54, which hold Folder at beta precisely because drift is not safely\
    \ exercisable. There is no metadata.tags to perturb, `name` is the identifier (perturbing it tests\
    \ rename semantics and risks the provider re-creating a duplicate rather than correcting, since findby\
    \ matches on name), and `default` has account-wide side effects that are not reversible by the correction.\
    \ Emitting driftUrl=/folders/{id} with driftField=default would produce a run that either 400s or\
    \ silently changes the real account's default folder. If you want Folder promoted to GA later, it\
    \ needs a purpose-built drift step that PUTs only {name, default} \u2014 not the generic injector.\n\
    \nPROVEN LIVE: docs/live-cluster-test.md records a real create -> observe -> delete of this exact\
    \ spec shape (folder id 6a9661334300bf195e381832), so the payload below is not inferred from the schema\
    \ alone.\n\nUPDATE VERB: PUT /folders/{id} exists (FolderUpdateDto {name, default}), mapped in restdefinitions/project/folder.yaml\
    \ with inPath id <- status.id.\n\nMinimal payload rationale: the CRD marks only configurationRef required,\
    \ so `default: false` is technically omissible, but it is included because it is what the already-proven\
    \ fixture sent and it makes the desired state explicit rather than relying on the API's null handling\
    \ \u2014 the same field oasgen-provider#76 showed can compare vacuously when left unset."
