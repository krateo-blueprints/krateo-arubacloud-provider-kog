  original:
    kind: Dbaas
    billable: true
    dependsOn: []
    hasUpdateVerb: true
    idField: metadata.id
    driftField: metadata.tags
    driftUrl: /projects/${PROJECT}/providers/Aruba.Database/dbaas/${id:self}
    confidence: high
    spec: "configurationRef:\n  name: dbaas-config\n  namespace: default\nprojectId: ${PROJECT}\nmetadata:\n\
      \  name: ga-dbaas\n  location:\n    value: ${LOCATION}\n  tags: []\nproperties:\n  dataCenter: ITBG-1\n\
      \  engine:\n    id: mysql-8.0\n  flavor:\n    name: DBO1A2\n  storage:\n    sizeGb: 20\n  billingPlan:\n\
      \    billingPeriod: Hour\n  networking:\n    vpcUri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/69a5609fa851081197caa45f\n\
      \    subnetUri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/69a5609fa851081197caa45f/subnets/69a560ce2312085699426c28\n\
      \    securityGroupUri: /projects/${PROJECT}/providers/Aruba.Network/vpcs/69a5609fa851081197caa45f/securityGroups/69a560ce2312085699426c2a"
    undeclaredConstraints:
    - properties.networking.{vpcUri,subnetUri,securityGroupUri} are effectively REQUIRED for this project.
      The OAS says 'Required when user has at least one VPC (with at least one subnet and a security group)'
      and marks them nullable/optional; the Terraform provider marks all three Required. I verified live
      (read-only GET) that project 69a55c8d5e6f0e14f14093ff has exactly one Active VPC with one Active
      subnet and one Active security group, so the condition IS triggered. Omitting them will 400.
    - 'properties.engine.id is a bare nullable string in the OAS but the API enforces a fixed set: mysql-8.0,
      mssql-2022-web, mssql-2022-standard, mssql-2022-enterprise (arubacloud.github.io/api/docs/metadata
      #dbaas-engines, and Arubacloud/sdk-go pkg/types/database.dbaas.go DatabaseEngine constants).'
    - 'properties.flavor.name is a bare nullable string but must be a DBO<vCPU>A<RAM> SKU from the catalog:
      DBO1A2, DBO1A4, DBO2A4, DBO2A8, DBO4A8, DBO4A16, DBO8A16, DBO8A32, DBO12A24, DBO16A32, DBO16A64,
      DBO24A48, DBO32A64.'
    - 'properties.dataCenter is the ZONE code (ITBG-1 / ITBG-2 / ITBG-3), NOT the region string. The OAS
      description links to the same doc page as metadata.location.value, which invites putting ''ITBG-Bergamo''
      here. The SDK even defaults zone to the region value when unset, which would be wrong. Region ITBG-Bergamo
      has exactly three data centers: ITBG-1, ITBG-2, ITBG-3.'
    - 'properties.storage.sizeGb has no min/max/multipleOf in the OAS. Aruba KB (cloud-dbaas/creating-a-service):
      dedicated MySQL/PostgreSQL 10-500 GB in 10 GB increments; dedicated MSSQL 100-1000 GB. 20 is the
      value used by the vendor''s own live acceptance test.'
    - properties.billingPlan.billingPeriod is a bare string; accepted values are Hour, Month, Year (Terraform
      provider docs/resources/dbaas.md). Hour is the platform default.
    - metadata.name is required by the API; the OAS declares no required fields anywhere in the create
      body.
    - Provisioning is slow. The vendor Terraform provider defaults to a 10m resource_timeout for DBaaS.
      ga_chain.py's default TIMEOUT=420s is very likely too short - export TIMEOUT=1800 for this chain.
    - 'The PUT (update) body is DbaasRequestDto (request shape) but the GET returns DbaasResponseDto (response
      shape). They differ where it matters: request networking is {vpcUri,subnetUri,securityGroupUri,elasticIpUri}
      while response networking is {vpc:{uri},subnet:{uri},securityGroup:{uri},elasticIp:{uri}}. ga_chain.py''s
      drift_check does a raw GET -> mutate metadata.tags -> PUT, so it would PUT a networking object with
      none of the three required *Uri keys.'
    notes: 'Only kind in the provider with an update verb, so the only one that can be drift-tested by
      the generic mechanism; metadata.tags exists in the spec and the GET+PUT pair share the same URL.
      CAVEAT on drift: ga_chain.py''s generic GET->mutate->PUT will send a response-shaped networking
      block back, which will most likely 400 (drift_check then prints ''PUT returned 400'' and returns
      None = SKIPPED, so no money is lost) but could in the worst case be accepted and detach the network
      binding. Recommend either running the first billable pass WITHOUT the drift line, or teaching drift_check
      to rebuild the request shape for Dbaas. VALUE SOURCING: engine mysql-8.0, flavor DBO*, dataCenter
      ITBG-1, billingPeriod Hour and the requiredness of the network triple all come from three independent
      places that agree - the official metadata catalog (arubacloud.github.io/api/docs/metadata), the
      vendor SDK constants (github.com/Arubacloud/sdk-go pkg/types/database.dbaas.go, pkg/types/region.go),
      and the vendor Terraform provider''s live acceptance test (internal/acctest/dbaas_resource_test.go),
      which creates exactly: location ITBG-Bergamo, zone ITBG-1, engine_id mysql-8.0, flavor DBO2A4, storage.size_gb
      20, network {vpc,subnet,security_group} and no elastic IP. FLAVOR CHOICE: I used DBO1A2 (cheapest,
      present in the official catalog and in the SDK constant list). It is sourced, not guessed, but it
      is not live-proven; DBO2A4 is the live-proven fallback if create 400s on the flavor. A rejected
      flavor costs a failed run, not money, since nothing is provisioned. NETWORK URIs: hardcoded to the
      project''s pre-existing default network, whose ids I confirmed live today - vpc 69a5609fa851081197caa45f
      (cloudburst-default, Active), subnet 69a560ce2312085699426c28 (automatic-subnet-01, Basic, default,
      Active), securityGroup 69a560ce2312085699426c2a (automatic-sg-01, default, Active). This mirrors
      the existing tests/ga/chains/schedule-metering.yaml, which already hardcodes the same VPC id. The
      alternative is dependsOn [Vpc, Subnet, SecurityGroup] with ${id:Vpc}/${id:Subnet}/${id:SecurityGroup},
      but that adds three creates and three failure modes to an already expensive chain. ElasticIp is
      optional and deliberately omitted - it bills separately. PREREQUISITE: dbaas-config (DbaasConfiguration)
      does not currently exist in the cluster; none of the five database Configuration CRs do. Apply samples/database/*-configuration.yaml
      before the run or every resource fails instantly.'
