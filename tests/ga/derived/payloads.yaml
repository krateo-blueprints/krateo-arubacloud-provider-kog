    \ so that PUT 400s. The single mutable field, `name`, IS the identifier \u2014 perturbing it risks\
    \ the controller falling back to findby, missing the renamed key and creating a DUPLICATE billable\
    \ key that then orphans and blocks the Kms delete. docs/ga-plan.md lists Key explicitly under \"no\
    \ safe field to perturb\". Hence driftField and driftUrl are empty. If a future per-resource drift\
    \ field is added, the single-object URL is /projects/${PROJECT}/providers/Aruba.Security/kms/${id:Kms}/keys/${id:self}\
