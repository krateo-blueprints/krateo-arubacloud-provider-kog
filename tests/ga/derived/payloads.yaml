  problems:
  - 'BLOCKING (confirmed by code + live cluster evidence): the run WILL abort after the billable Dbaas
    parent is already provisioned. /Users/diegobraga/krateo/krateo-arubacloud-provider-kog/scripts/ga_chain.py:267
    calls upstream_id(kind, name, res.get(''idPath'')) and line 269 raises RuntimeError(f''{kind}/{name}
    reported no upstream id'') when it returns None. upstream_id (lines 145-168) tries only {.status.metadata.id},
    {.status.id}, then scans status keys for one whose lowercase name ends in ''id''. The live Database
    CRD status schema has EXACTLY two properties: ''conditions'' and ''name'' -- neither ends in ''id''.
    So without an explicit idPath the chain dies right after creating the resource. This is why tests/ga/chains/security.yaml
    gets away without idPath: the live Key CR (kubectl get key.arubacloud.ogen.krateo.io/ga-key) has status
    {conditions, keyId, name} and ''keyId'' satisfies the fallback scan. Database has no such field. Fix:
    the chain resource entry MUST declare idPath: name.'
  - 'BLOCKING (terminology): the claim says ''idField=name'', but ''idField'' is NOT a key ga_chain.py
    reads. ''idField'' exists only in scripts/generate_restdefinitions.py (the RestDefinition generator).
    The chain runner reads res.get(''idPath'') (scripts/ga_chain.py:267). Carrying the claim across as
    ''idField: name'' in the chain YAML would be silently ignored and produce exactly the failure above.'
