      \ no PUT/PATCH on cloudServers in either compute-provider.json or compute-provider_v1.1.json; updates\
      \ are the imperative action endpoints (poweron/poweroff/associateDisassociate*/attachDetachDataVolumes/password/restore)\
      \ delegated to updateApiRef.\n\ndependsOn: [] is correct FOR THE PAYLOAD I EMITTED (it references\
      \ nothing). It is NOT the real provisioning order. Once blockers 1-3 are fixed the chain order is:\
      \ BlockStorage (bootable boot volume) -> KeyPair -> [Vpc -> Subnet -> SecurityGroup, only if you\
      \ want NIC/SG attachment] -> CloudServer. Listing those now would spend real money on parents for\
      \ a step that cannot succeed, which is why I left it empty.\n\nFOR WHEN THE GAP IS FIXED \u2014\
      \ the minimal create body, fully sourced from CloudServerDto in openapi/compute-provider_v1.1.json\
      \ plus the metadata docs. This is the API payload; it becomes the CR spec verbatim only after the\
      \ v1.1 POST is merged into configmaps/compute-openapi.yaml (compute.json) so oasgen regenerates\
      \ the CRD with metadata/properties:\n  metadata:\n    name: ga-cloudserver\n    location:\n    \
      \  value: ${LOCATION}\n    tags: []\n  properties:\n    dataCenter: ITBG-1\n    flavorName: CSO1A2\n\
      \    bootVolume:\n      uri: /projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:BlockStorage}\n\
      \    keyPair:\n      uri: /projects/${PROJECT}/providers/Aruba.Compute/keyPairs/${id:KeyPair}\n\
      \    vpcPreset: true\nwith the boot volume created first as a BlockStorage carrying properties:\
      \ {sizeGb: 20, billingPeriod: Hour, type: Standard, dataCenter: ITBG-1, bootable: true, image: alma9}\
      \ \u2014 all six of those fields verified present in the live blockstorages CRD schema. vpcPreset:\
      \ true lets Aruba supply default networking so the chain does not need Vpc/Subnet/SecurityGroup;\
      \ it is declared in the v1.1 OAS as a nullable boolean with no description, so treat it as medium-confidence\
      \ and prefer explicit subnets[]/securityGroups[] URIs if the first live run rejects it. CSO1A2 is\
      \ the smallest flavor and is Linux-only, which is why the image is alma9 rather than a WS* Windows\
      \ image.\n\nAlso worth fixing while you are in there: compositions/aruba-cloudserver-environment/values.yaml\
      \ + templates/resources.yaml are wrong on all three sourced values (flavorName: A1, dataCenter:\
      \ {{ .Values.location }} = ITBG-Bergamo, bootVolume: {sizeGb: 40}), and templates/resources.yaml\
      \ still emits spec.metadata/spec.properties on CloudServer plus REPLACE_WITH_VPC_ID placeholders\
      \ on Subnet/SecurityGroup."
- provider: storage
  kind: Restore
  problems:
  - "driftField=metadata.tags is REFUTED \u2014 the repo explicitly rules this out for Restore. /Users/diegobraga/krateo/krateo-arubacloud-provider-kog/docs/ga-plan.md:181\
    \ lists the obstacle verbatim: \"`Key`, `Kmip`, `Restore`, `Folder` have no safe field to perturb\
    \ | Declare a per-resource drift field in the chain fixture rather than relying on `metadata.tags`\"\
    . ga-plan.md:203 adds that Restore is \"action-shaped\" and its drift \"may not be meaningful \u2014\
    \ there may be nothing to converge\". docs/coverage.md:64 records Restore as beta with \"drift not\
    \ exercised\". The proven fixture tests/ga/chains/storage.yaml has NO `drift:` key on the Restore\
    \ entry, unlike the other three storage resources \u2014 that omission is deliberate, not an oversight."
  - "driftField=metadata.tags is also unsupported by the OAS: `RestoreUpdatePropertiesDto` in openapi/storage-provider.json\
    \ is a completely EMPTY schema (`{type: object, additionalProperties: false}` \u2014 zero properties).\
    \ A Restore has literally nothing updatable except metadata. Perturbing tags forces a PUT on /projects/{p}/providers/Aruba.Storage/backups/{backupId}/restores/{id},\
    \ i.e. re-PUTting a restore ACTION whose target is a live block storage volume. The semantics of re-PUTting\
    \ an in-flight/completed restore are unverified against Aruba and could re-execute the restore over\
    \ the destination volume. That is not a harmless tag write on a billable run."
  - "If drift is added anyway, the drift URL pattern used everywhere else in the repo will 404. Every\
    \ existing `drift:` value in tests/ga/chains/storage.yaml is a flat collection path ending in `${id:self}`.\
    \ Restore is nested under its parent backup, so the URL must be /projects/${PROJECT}/providers/Aruba.Storage/backups/${id:Backup}/restores/${id:self}\
    \ \u2014 it is the only resource in the chain whose drift URL needs a second `${id:Kind}` interpolation.\
    \ Copying the neighbouring pattern gives an unreachable path."
  - "billable=true is NOT supported by the CRD schema. `kubectl get crd restores.arubacloud.ogen.krateo.io\
    \ -o json` contains ZERO occurrences of the string \"billing\" \u2014 no billingPlan, no billingPeriod.\
    \ By contrast blockstorages has `billing`/`billingPeriod` and backups has `billingPeriod`. The repo's\
    \ own criterion (docs/live-cluster-test.md: \"`VpcPeering` is free: it declares no `billingPlan`\"\
    ) therefore classifies Restore itself as free. docs/live-cluster-test.md's claim that in the storage\
    \ chain \"all four declare `billingPeriod`\" is factually wrong for Restore. NOTE: this error is in\
    \ the SAFE direction (billable=true only causes the step to be skipped without --with-billable), and\
    \ the Restore step is unrunnable without its billing dependencies (BlockStorage, Backup), so keeping\
    \ the flag true for the chain is defensible \u2014 but the derivation's stated basis is false and\
    \ should not be recorded as evidence."
  - confidence=high is unwarranted. Two of the four claims (driftField, billable) do not survive contact
    with the CRD schema and the repo's own recorded findings. Correct confidence for the claim set is
    low; confidence for the spec YAML alone is high.
  correctedSpec: "# Restore \u2014 spec body verified against the live CRD and openapi/storage-provider.json.\n\
    # The YAML below is byte-identical to the entry in tests/ga/chains/storage.yaml that\n# already created\
    \ and observed a real Restore (id 6a99c631, docs/live-cluster-test.md).\n# It needs no change. What\
    \ was wrong is the surrounding claim set:\n#\n#   billable:   false at the CRD level (Restore declares\
    \ NO billingPlan/billingPeriod;\n#               0 occurrences of \"billing\" in the CRD). Keep the\
    \ chain step gated\n#               behind --with-billable only because BlockStorage/Backup/Snapshot\
    \ bill.\n#   dependsOn:  [\"BlockStorage\",\"Backup\"]        -- CONFIRMED correct\n#   idField: \
    \   metadata.id                      -- CONFIRMED correct\n#               (findby -> RestoreListResponseDto.values[]\
    \ -> RestoreResponseDto\n#                -> metadata.id from MetadataResponseDto; matches the RestDefinition's\n\
    #                additionalStatusFields and its status.metadata.id requestFieldMapping)\n#   driftField:\
    \ none. Do NOT perturb metadata.tags. Restore is action-shaped, its\n#               RestoreUpdatePropertiesDto\
    \ is empty, and ga-plan.md:181/203 rule it out.\n#               GA bar for Restore is create -> observe\
    \ -> delete.\n#   confidence: low on the claim set, high on the spec body.\nconfigurationRef:\n  name:\
    \ restore-config\n  namespace: default\nprojectId: ${PROJECT}\nbackupId: ${id:Backup}\nmetadata:\n\
    \  name: ga-restore\n  location:\n    value: ${LOCATION}\n  tags: []\nproperties:\n  destinationVolume:\n\
    \    uri: /projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:BlockStorage}\n"
  original:
    kind: Restore
    billable: true
    dependsOn:
    - BlockStorage
    - Backup
    spec: "configurationRef:\n  name: restore-config\n  namespace: default\nprojectId: ${PROJECT}\nbackupId:\
      \ ${id:Backup}\nmetadata:\n  name: ga-restore\n  location:\n    value: ${LOCATION}\n  tags: []\n\
      properties:\n  destinationVolume:\n    uri: /projects/${PROJECT}/providers/Aruba.Storage/blockStorages/${id:BlockStorage}\n"
    confidence: high
    idField: metadata.id
    hasUpdateVerb: true
    driftField: metadata.tags
    driftUrl: /projects/${PROJECT}/providers/Aruba.Storage/backups/${id:Backup}/restores/${id:self}
    undeclaredConstraints:
    - 'properties.destinationVolume.uri is effectively required. RestoreDto declares properties as nullable
      and lists no required fields, but a restore with no destination is meaningless and every proven-live
      payload supplies it. The OAS description is also wrong/copy-pasted: it says ''The source volume
      for this restore'' on destinationVolume.'
    - 'metadata.name is effectively required even though the CRD marks only backupId/configurationRef/projectId
      as required. The RestDefinition sets identifiers: [metadata.name]; without it the connector''s findby
      cannot match the remote object and the CR will never reconcile / may re-create.'
    - destinationVolume.uri must be a full Aruba resource URI under Aruba.Storage/blockStorages (/projects/{p}/providers/Aruba.Storage/blockStorages/{id}),
      not a bare id. Same pattern as Snapshot.volume.uri and Backup.sourceVolume.uri in the same provider.
    - "The parent Backup must exist and be Ready before the Restore POST; backupId is a path parameter,\
      \ so a Restore is only addressable through its backup. This also means a Restore can never be listed\
      \ from a top-level /restores collection \u2014 residue for it must be checked per-backup."
    - "RestoreUpdatePropertiesDto is an EMPTY object with additionalProperties:false, so the PUT (update)\
      \ body can carry metadata only \u2014 properties.destinationVolume is immutable and not expressible\
      \ on update. This is undeclared in the sense that the create and update DTOs silently diverge."
    - Storage updates are asynchronous and answer 202 Accepted, not 200 (already handled by scripts/ga_chain.py
      drift_check, noted here so a 202 is not read as failure).
    - 'Restore is action-shaped: DELETE removes the restore record, not the restored data. Teardown of
      the Restore CR does not roll back the write to the destination volume.'
    notes: "VERIFIED AGAINST THE GENERATED CRD. kubectl --context kind-aruba-ga get crd restores.arubacloud.ogen.krateo.io\
      \ (single served/storage version v1-0-0) exposes exactly: spec.backupId, spec.configurationRef{name,namespace},\
      \ spec.projectId, spec.metadata{name, location.value, tags[]}, spec.properties.destinationVolume.uri.\
      \ Every field emitted above is in that set; nothing else exists to set. status carries only metadata.id\
      \ and metadata.name.\n\nNO ENUMS ANYWHERE. The Restore CRD contains zero enum fields and zero identifier-like\
      \ strings, so nothing had to be sourced from arubacloud.github.io/api/docs/metadata. The only sourced\
      \ value is location ${LOCATION}=ITBG-Bergamo, taken from LocationDto.description in openapi/storage-provider.json\
      \ ('Available regions at present: - ITBG-Bergamo').\n\nID FIELD, from the FINDBY RESPONSE SCHEMA\
      \ (not the path param). findby GET /projects/{projectId}/providers/Aruba.Storage/backups/{backupId}/restores\
      \ returns RestoreListResponseDto -> values[] -> RestoreResponseDto -> metadata (MetadataResponseDto)\
      \ -> id. So the server id is at metadata.id, NOT a bare 'id' and not a 'restoreId'. The RestDefinition\
      \ agrees (additionalStatusFields: metadata.id; get/update/delete map inPath id <- status.metadata.id),\
      \ and scripts/ga_chain.py upstream_id() resolves {.status.metadata.id} by default, so no id_path\
      \ override is needed.\n\nBILLABLE = TRUE, with a caveat worth stating precisely. The Restore CRD\
      \ itself mentions NEITHER billingPlan NOR billingPeriod (grep over the CRD JSON returns nothing),\
      \ so by the literal rule it is free. It must still be marked billable because it is unreachable\
      \ without two billable parents: it needs ${id:Backup} (Backup declares billingPeriod) which in turn\
      \ needs ${id:BlockStorage} (declares billingPeriod). If it were declared billable:false, a run without\
      \ --with-billable would skip the parents and then ga_chain.expand() would raise KeyError('${id:Backup}\
      \ used before Backup was created'). docs/live-cluster-test.md line ~483 claims 'all four declare\
      \ billingPeriod' for this chain \u2014 that is slightly wrong for Restore specifically; the cost\
      \ is inherited, not intrinsic.\n\nPROVENANCE OF THE PAYLOAD. This exact spec already exists in tests/ga/chains/storage.yaml\
      \ (the only commit touching that file is 6d0abc6, and the tree is clean), and docs/live-cluster-test.md\
      \ records the Wave 3 run: 'Restore 6a99c631 created and observed', teardown 4/4, residue 0. So create+observe+delete\
      \ are proven live with this body. Hence confidence high.\n\nDRIFT \u2014 READ THIS BEFORE ENABLING\
      \ IT. The chain file deliberately has NO drift: entry for Restore, and Restore is still tiered beta\
      \ in docs/coverage.md for exactly that reason ('drift not exercised'). docs/ga-plan.md lists Restore\
      \ among resources with 'no safe field to perturb'. That is only half right: spec.metadata.tags does\
      \ exist in the CRD and RestoreUpdateDto does accept metadata (MetadataDto with tags), so metadata.tags\
      \ is the correct driftField and the driftUrl above is correct. The real hazard is in the harness:\
      \ scripts/ga_chain.py drift_check() GETs the object, strips status and the read-only metadata keys,\
      \ and PUTs the WHOLE remaining body back \u2014 including properties.destinationVolume. The update\
      \ DTO (RestoreUpdatePropertiesDto) is an empty object with additionalProperties:false, so that PUT\
      \ may be rejected 400. drift_check treats a non-2xx PUT as SKIPPED (returns None), not FAILED, so\
      \ enabling drift cannot fail the run \u2014 worst case it reports SKIPPED, best case it earns Restore\
      \ its GA drift evidence. Recommendation: enable it, and if it 400s, the fix is to strip 'properties'\
      \ from the desired body for this kind rather than to invent a different drift field.\n\nWHAT I DID\
      \ NOT DO: no resources created/modified/deleted, ga_chain.py not run, only read-only kubectl get\
      \ crd."
