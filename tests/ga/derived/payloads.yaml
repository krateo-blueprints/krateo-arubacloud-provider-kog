  hasUpdateVerb: true
  driftUrl: ''
  driftField: ''
  confidence: high
  undeclaredConstraints:
  - "OAS declares no `required` list on the create body {name, algorithm}; `name` is effectively mandatory\
    \ because the RestDefinition identifier is `name` (identifiers: [name]) and findby matches on it \u2014\
    \ a nameless key can never be observed."
  - "`algorithm` is optional in the OAS but a key has no server-side default; the only successful live\
    \ create sent `algorithm: Aes`. Omitting it is untested \u2014 send Aes."
  - 'Parent Kms cannot be deleted while any key still exists: DELETE /projects/{p}/providers/Aruba.Security/kms/{id}
    returns 400 `Some kms keys are not deleted`. Key must be deleted (and settle) before Kms.'
  - "PUT /kms/{id}/keys/{keyId} accepts only {name} with additionalProperties:false \u2014 there is no\
    \ tags/metadata field, so the harness's generic metadata.tags drift injection would be rejected with\
    \ 400."
  - Deleting a key is asynchronous (status enum includes Deleting/Deleted); the parent Kms delete can
    still 400 with the stale `Some kms keys are not deleted` message for a while after the key DELETE
    returns.
  notes: "Verified against live CRD keys.arubacloud.ogen.krateo.io (version v1-0-0): spec properties are\
    \ exactly [algorithm, configurationRef, id, name, projectId]; required = [configurationRef, id, projectId].\
    \ There is NO metadata/location/properties/tags block \u2014 do not add ${LOCATION} or metadata.*,\
    \ strict decoding rejects them.\n\nspec.id is the PARENT Kms id (path param {id} of /projects/{projectId}/providers/Aruba.Security/kms/{id}/keys),\
    \ NOT the key's own id. The key's own id lands in status.keyId (excludedSpecFields: [keyId]).\n\n\
    algorithm enum sourced from openapi/security-provider.json (POST .../keys request schema and the mirrored\
    \ CRD enum): Aes | Rsa. Aes yields type=Symmetric. No value invented.\n\nidField=keyId comes from\
    \ the FINDBY response item schema {keyId, privateKeyId, name, algorithm, creationSource, type, status}\
    \ \u2014 not from the {keyId} path param coincidence. restdefinitions/security/key.yaml maps every\
    \ {keyId} path param to status.keyId and declares additionalStatusFields: [keyId].\n\nKNOWN OPEN RISK\
    \ (docs/live-cluster-test.md + docs/coverage.md, tier `experimental`): on the last live run the CR\
    \ reported no upstream id \u2014 status.keyId stayed empty and the Key never went Ready \u2014 even\
    \ with the corrected mapping. The create payload itself is proven (a real key was created: {\"keyId\"\
    :\"ebe348c2\u2026\",\"name\":\"ga-key\",\"algorithm\":\"Aes\",\"status\":\"Active\"}); it is the observe\
    \ that is unproven. If status.keyId is empty on delete, RDC releases the finalizer WITHOUT calling\
    \ the API and the key is orphaned, which then blocks the parent Kms delete. Watch status.keyId before\
    \ teardown and be ready to delete by hand.\n\nBillable: the Key CRD schema itself mentions neither\
    \ billingPlan nor billingPeriod, but Key cannot exist without a parent Kms, whose CRD declares properties.billingPeriod\
