# CloudServer DELETE (teardown) — delegated from the CloudServer RestDefinition
# via `deleteApiRef`. The controller holds the finalizer until the server is
# verifiably gone, and re-invokes this on every reconcile, so it MUST be
# idempotent and tolerate an already-gone server.
#
# CONTEXT CONTRACT (verified against rest-dynamic-controller's buildExtras,
# observe_restaction.go): unlike create/update, a DELETE invocation does NOT
# receive the CR's spec. It receives only:
#   - the static extras from the RestDefinition's deleteApiRef (here: api-version
#     and projectId — which is why projectId MUST be set statically below /
#     in the RestDefinition, since spec.projectId is unavailable on delete);
#   - name / namespace / uid of the CR;
#   - each identifier's value keyed by its PATH STRING: the server name arrives
#     as the dot-keyed extra `.["metadata.name"]`, NOT `.spec.metadata.name`.
# Reading .spec.* here would yield null, every guard would skip, and the
# finalizer would never release (delete deadlock). See
# docs/oasgen-provider-evolution.md §C6.
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: arubacloud-compute-cloudserver-delete
  namespace: krateo-system
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    - name: server
      endpointRef:
        name: arubacloud-endpoint
        namespace: krateo-system
      verb: GET
      # projectId comes from the deleteApiRef's static extras (delete has no spec).
      path: ${ "/projects/" + .projectId + "/providers/Aruba.Compute/cloudServers?api-version=1.0" }
      headers:
        - "Accept: application/json"
      continueOnError: true
      filter: >-
        .["metadata.name"] as $n
        | { self: ((.values // []) | map(select(.metadata.name == $n)) | .[0]) }

    # Detach any attached data volumes first (skipped when there are none).
    - name: detachVolumes
      endpointRef:
        name: arubacloud-endpoint
        namespace: krateo-system
      dependsOn:
        name: server
        iterator: >-
          (.server.self // {}) as $s
          | (($s.properties.dataVolumes // []) | map(.uri // .)) as $vols
          | if $s.id != null and ($vols | length) > 0
            then [ { id: $s.id, detach: $vols } ] else [] end
      verb: POST
      continueOnError: true
      path: ${ "/projects/" + $.projectId + "/providers/Aruba.Compute/cloudServers/" + .id + "/attachDetachDataVolumes?api-version=1.0" }
      headers:
        - "Content-Type: application/json"
      payload: |
        ${ { volumesToAttach: [], volumesToDetach: .detach } }

    # Delete the server (skipped when already absent).
    - name: delete
      endpointRef:
        name: arubacloud-endpoint
        namespace: krateo-system
      dependsOn:
        name: server
        iterator: >-
          (.server.self // {}) as $s
          | if $s.id != null then [ $s.id ] else [] end
      verb: DELETE
      continueOnError: true
      path: ${ "/projects/" + $.projectId + "/providers/Aruba.Compute/cloudServers/" + . + "?api-version=1.0" }
