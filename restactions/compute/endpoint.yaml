# DO NOT `kubectl apply -f restactions/compute/` -- APPLY THE RESTACTION FILES BY NAME.
#
# This file lives in the same directory as the three RESTActions, and it is a Secret
# carrying a PLACEHOLDER token. So a directory apply overwrites whatever real token is
# already in the cluster with `REPLACE_WITH_ARUBA_JWT`, and nothing says so: the apply
# succeeds, the Secret still exists, and the next delegated call authenticates to
# Snowplow correctly and then fails at ARUBA with a bogus bearer token -- an auth
# failure two layers from its cause, which looks like a Snowplow problem.
#
# scripts/pin_verify.sh did exactly this, behind `>/dev/null 2>&1 ||` with a
# named-file fallback that never ran because the directory apply succeeded. It now
# applies the three files by name and asserts this Secret does not hold the
# placeholder. See docs/coverage.md, "What does not count as evidence".
#
# Snowplow Endpoint (a Kubernetes Secret) that the CloudServer RESTActions call.
# It points at the Aruba Cloud API and carries the Bearer token. This is the SAME
# token used by the *Configuration resources; the RESTActions run under Snowplow's
# identity, so they need their own endpoint reference.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: arubacloud-endpoint
  namespace: krateo-system
stringData:
  server-url: https://api.arubacloud.com
  token: REPLACE_WITH_ARUBA_JWT   # short-lived Bearer token; rotate as needed
