# Aruba Cloud DatabaseUser (database provider) - generated, no proxy.
# DatabaseUser is name-keyed (create {username, password}). 'password' is dropped from the spec and sourced from a Secret at create time via the secretRef resolver. The Secret is named after the CR and keyed by the username, both read from the CR itself - which is what makes this work without adding a *SecretRef field the source OAS does not declare, and the OAS is not ours to change. Its VALUE must be the base64 of the password: Aruba requires that and does not document it (their Terraform provider encodes client-side, dbaasuser_resource.go:130). A jq valueMapping of @base64 cannot do that encoding for us on RDC <= 0.24.0, which runs jq on the response direction only and silently skips it on a request; oasgen#148 implements the request direction, so once it ships this could hold the plaintext instead - see docs/authentication.md before switching. No update verb (password change is a separate PUT .../password sub-endpoint).
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-database-databaseuser
spec:
  oasPath: configmap://krateo-system/arubacloud-database-openapi/database.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: DatabaseUser
    identifiers:
    - username
    excludedSpecFields:
    - password
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.username
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users
      fieldMapping:
      - inBody: password
        resolver:
          type: secretRef
          secretRef:
            nameFromCustomResource: metadata.name
            keyFromCustomResource: spec.username
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.username
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
