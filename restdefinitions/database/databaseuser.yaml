# Aruba Cloud DatabaseUser (database provider) - generated, no proxy.
# DatabaseUser is name-keyed (create {username, password}). 'password' is a plaintext spec field in the source OAS; sourcing it from a Kubernetes Secret needs the secretRef resolver plus an OAS-declared *SecretRef field - see docs/oasgen-provider-evolution.md. No update verb (password change is a separate PUT .../password sub-endpoint).
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-database-databaseuser
spec:
  oasPath: configmap://krateo-system/arubacloud-database-openapi/database.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: DatabaseUser
    identifiers:
    - username
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.username
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/users/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.username
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
