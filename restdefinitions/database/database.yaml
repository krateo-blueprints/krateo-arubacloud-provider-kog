# Aruba Cloud Database (database provider) - generated, no proxy.
# Database is name-keyed: create body {name}; there is no server id and no update verb. NOTE the source OAS is inconsistent - GET uses {databaseName} while DELETE uses {name} for the same path segment.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-database-database
spec:
  oasPath: configmap://krateo-system/arubacloud-database-openapi/database-provider.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Database
    identifiers:
    - name
    excludedSpecFields:
    - databaseName
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}
      requestFieldMapping:
      - inPath: databaseName
        inCustomResource: spec.name
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{name}
      requestFieldMapping:
      - inPath: name
        inCustomResource: spec.name
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
