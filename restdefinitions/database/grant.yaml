# Aruba Cloud Grant (database provider) - generated, no proxy.
# Grant is name-keyed. The create body nests the name as {user:{username}} and the item path segment is {username}, so the identifier must be the LEAF user.username, NOT the object `user`. Binding the object produced GET .../grants/map%5Busername:gauser%5D -- Go stringified the map into the path -- so observe never matched and the controller re-POSTed until the API answered 'A grant already exists for the specified Database User'. No update verb and no dedicated id.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-database-grant
spec:
  oasPath: configmap://krateo-system/arubacloud-database-openapi/database.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Grant
    identifiers:
    - user.username
    excludedSpecFields:
    - filter
    - limit
    - offset
    - projection
    - sort
    - username
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.user.username
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.user.username
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
