# Aruba Cloud Grant (database provider) - generated, no proxy.
# Grant is name-keyed (create {user, role}); item path segment is {username}. No update/dedicated id.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-database-grant
spec:
  oasPath: configmap://krateo-system/arubacloud-database-openapi/database-provider.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Grant
    identifiers:
    - user
    excludedSpecFields:
    - username
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.user
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{dbaasId}/databases/{databaseName}/grants/{username}
      requestFieldMapping:
      - inPath: username
        inCustomResource: spec.user
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
