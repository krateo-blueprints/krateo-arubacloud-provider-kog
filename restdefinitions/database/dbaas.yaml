# Aruba Cloud Dbaas (database provider) - generated, no proxy.
# Dbaas creation is asynchronous: the API returns the object while status.state is still InCreation, and refuses every update until it reaches Active (400 DBaaS.Read.InvalidStatus). Without the async block the CR reports Ready in seconds for a resource that is unusable for a quarter of an hour. Polls its own item path, since this provider publishes no monitor endpoint. State values come from security-provider.json, which declares the vocabulary the database spec omits.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-database-dbaas
spec:
  oasPath: configmap://krateo-system/arubacloud-database-openapi/database.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Dbaas
    identifiers:
    - metadata.name
    additionalStatusFields:
    - metadata.id
    - status.failureReason
    - status.error
    excludedSpecFields:
    - id
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{id}
      requestFieldMapping:
      - inPath: id
        inCustomResource: status.metadata.id
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Database/dbaas
      async:
        mode: requeue
        operationRef:
          in: body
          path: metadata.id
        poll:
          method: GET
          path: /projects/{projectId}/providers/Aruba.Database/dbaas/{id}
          handleParam: id
          statusPath: status.state
          successValues:
          - Active
          failureValues:
          - Failed
          intervalSeconds: 15
          maxAttempts: 120
        postGet: true
    - action: update
      method: PUT
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{id}
      requestFieldMapping:
      - inPath: id
        inCustomResource: status.metadata.id
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Database/dbaas/{id}
      requestFieldMapping:
      - inPath: id
        inCustomResource: status.metadata.id
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: ignoreDeletedStatus
        in: query
      fromRestDefinition:
        actions:
        - get
