# Aruba Cloud BackupPolicy (schedule provider) - generated, no proxy.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-schedule-backuppolicy
spec:
  oasPath: configmap://krateo-system/arubacloud-schedule-openapi/schedule-provider.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: BackupPolicy
    identifiers:
    - metadata.name
    additionalStatusFields:
