      method: GET
      path: /projects/{projectId}/providers/Aruba.Schedule/backupPolicies/{id}
      requestFieldMapping:
      - inPath: id
        inCustomResource: status.metadata.id
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Schedule/backupPolicies
    - action: update
      method: PUT
      path: /projects/{projectId}/providers/Aruba.Schedule/backupPolicies/{backupPolicyId}
      requestFieldMapping:
      - inPath: backupPolicyId
        inCustomResource: status.metadata.id
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Schedule/backupPolicies/{backupPolicyId}
      requestFieldMapping:
      - inPath: backupPolicyId
        inCustomResource: status.metadata.id
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: includeDeleted
        in: query
      fromRestDefinition:
        actions:
        - get
