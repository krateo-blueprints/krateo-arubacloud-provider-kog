# Aruba Cloud KeyPair (compute provider) - generated, no proxy.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-compute-keypair
spec:
  oasPath: configmap://krateo-system/arubacloud-compute-openapi/compute.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: KeyPair
    identifiers:
    - metadata.name
    additionalStatusFields:
    - metadata.id
    - status.failureReason
    - status.error
    excludedSpecFields:
    - filter
    - keyPairId
    - limit
    - offset
    - projection
    - sort
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Compute/keyPairs
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Compute/keyPairs/{keyPairId}
      requestFieldMapping:
      - inPath: keyPairId
        inCustomResource: status.metadata.id
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Compute/keyPairs
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Compute/keyPairs/{keyPairId}
      requestFieldMapping:
      - inPath: keyPairId
        inCustomResource: status.metadata.id
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: ignoreDeletedStatus
        in: query
      fromRestDefinition:
        actions:
        - get
