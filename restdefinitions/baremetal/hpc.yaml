# Aruba Cloud Hpc (baremetal provider) - generated, no proxy.
# HPC provisioning is asynchronous. create returns 201 {monitorUri}; the controller polls GET .../hpcs/monitor/{id} (status Succeeded|Failed) via the async block in requeue mode, then re-runs findby to populate status. HPC has no delete verb in the API.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-baremetal-hpc
spec:
  oasPath: configmap://krateo-system/arubacloud-baremetal-openapi/baremetal.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Hpc
    identifiers:
    - metadata.name
    additionalStatusFields:
    - metadata.id
    excludedSpecFields:
    - id
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Baremetal/hpcs
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Baremetal/hpcs/{id}
      requestFieldMapping:
      - inPath: id
        inCustomResource: status.metadata.id
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Baremetal/hpcs
      async:
        mode: requeue
        operationRef:
          in: body
          path: monitorUri
          jq:
            inline: . | split("/") | last
        poll:
          method: GET
          path: /projects/{projectId}/providers/Aruba.Baremetal/hpcs/monitor/{operationId}
          statusPath: status
          successValues:
          - Succeeded
          failureValues:
          - Failed
          intervalSeconds: 5
          maxAttempts: 120
        postGet: true
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: calculatePrices
        in: query
      fromRestDefinition:
        actions:
        - get
