# Aruba Cloud LoadBalancer (network provider) - generated, no proxy.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-network-loadbalancer
spec:
  oasPath: configmap://krateo-system/arubacloud-network-openapi/network.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: LoadBalancer
    identifiers:
    - metadata.name
    additionalStatusFields:
    - metadata.id
    - status.failureReason
    - status.error
    excludedSpecFields:
    - filter
    - id
    - limit
    - offset
    - projection
    - sort
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Network/loadBalancers
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Network/loadBalancers/{id}
      requestFieldMapping:
      - inPath: id
        inCustomResource: status.metadata.id
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: ignoreDeletedStatus
        in: query
      fromRestDefinition:
        actions:
        - get
