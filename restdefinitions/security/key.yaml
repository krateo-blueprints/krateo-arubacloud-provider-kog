# Aruba Cloud Key (security provider) - generated, no proxy.
# Key create body is flat {name, algorithm}. The findby item carries the server id as **keyId**, not id -- mapping status.id here produced a CR that never went Ready while the key WAS created, and whose delete then had an unresolvable path parameter, so RDC released the finalizer without calling the API and the key was orphaned. An orphaned key in turn blocks deleting its Kms ('Some kms keys are not deleted').
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-security-key
spec:
  oasPath: configmap://krateo-system/arubacloud-security-openapi/security.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Key
    identifiers:
    - name
    additionalStatusFields:
    - keyId
    excludedSpecFields:
    - keyId
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/keys
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/keys/{keyId}
      requestFieldMapping:
      - inPath: keyId
        inCustomResource: status.keyId
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/keys
    - action: update
      method: PUT
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/keys/{keyId}
      requestFieldMapping:
      - inPath: keyId
        inCustomResource: status.keyId
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/keys/{keyId}
      requestFieldMapping:
      - inPath: keyId
        inCustomResource: status.keyId
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
