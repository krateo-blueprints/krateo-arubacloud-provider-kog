# Aruba Cloud Kmip (security provider) - generated, no proxy.
# Kmip create body is flat {name}; item keyed by server id {kmipId}.
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: arubacloud-security-kmip
spec:
  oasPath: configmap://krateo-system/arubacloud-security-openapi/security.json
  resourceGroup: arubacloud.ogen.krateo.io
  resource:
    kind: Kmip
    identifiers:
    - name
    additionalStatusFields:
    - id
    excludedSpecFields:
    - kmipId
    verbsDescription:
    - action: findby
      method: GET
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/kmip
    - action: get
      method: GET
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/kmip/{kmipId}
      requestFieldMapping:
      - inPath: kmipId
        inCustomResource: status.id
    - action: create
      method: POST
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/kmip
    - action: update
      method: PUT
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/kmip/{kmipId}
      requestFieldMapping:
      - inPath: kmipId
        inCustomResource: status.id
    - action: delete
      method: DELETE
      path: /projects/{projectId}/providers/Aruba.Security/kms/{id}/kmip/{kmipId}
      requestFieldMapping:
      - inPath: kmipId
        inCustomResource: status.id
    configurationFields:
    - fromOpenAPI:
        name: api-version
        in: query
      fromRestDefinition:
        actions:
        - '*'
    - fromOpenAPI:
        name: filter
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: sort
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: projection
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: offset
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: limit
        in: query
      fromRestDefinition:
        actions:
        - findby
    - fromOpenAPI:
        name: includeDeleted
        in: query
      fromRestDefinition:
        actions:
        - get
